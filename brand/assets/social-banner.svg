<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="WMOOP — World Map Object-Oriented Programming">
  <defs>
    <linearGradient id="bnBg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bnGlobe" x1="14" y1="16" x2="106" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="640" fill="url(#bnBg)"/>

  <!-- faint world watermark on the right -->
  <g fill="none" stroke="#1E293B" stroke-width="2" opacity="0.7">
    <circle cx="1070" cy="330" r="300"/>
    <ellipse cx="1070" cy="330" rx="116" ry="300"/>
    <ellipse cx="1070" cy="330" rx="300" ry="116"/>
  </g>

  <!-- the mark -->
  <g transform="translate(66,176) scale(2.4)">
    <g fill="none" stroke="url(#bnGlobe)" stroke-width="4.5">
      <circle cx="60" cy="60" r="44"/>
      <ellipse cx="60" cy="60" rx="17" ry="44" stroke-width="3"/>
      <ellipse cx="60" cy="60" rx="44" ry="17" stroke-width="3"/>
    </g>
    <g stroke="#60A5FA" stroke-width="4" stroke-linecap="round">
      <line x1="60" y1="60" x2="60" y2="16"/><line x1="60" y1="60" x2="104" y2="60"/>
      <line x1="60" y1="60" x2="60" y2="104"/><line x1="60" y1="60" x2="16" y2="60"/>
    </g>
    <path d="M74 60 L81 55 L88 60 L81 65 Z" fill="#FBBF24" stroke="#78350F" stroke-width="2"/>
    <g stroke-width="3.5">
      <rect x="53.5" y="53.5" width="13" height="13" rx="3.5" fill="#0B1120" stroke="#60A5FA"/>
      <rect x="53.5" y="9.5"  width="13" height="13" rx="3.5" fill="#0B1120" stroke="#60A5FA"/>
      <rect x="53.5" y="97.5" width="13" height="13" rx="3.5" fill="#0B1120" stroke="#60A5FA"/>
      <rect x="9.5"  y="53.5" width="13" height="13" rx="3.5" fill="#0B1120" stroke="#60A5FA"/>
      <rect x="97.5" y="53.5" width="13" height="13" rx="3.5" fill="#FBBF24" stroke="#78350F"/>
    </g>
  </g>

  <!-- wordmark + taglines -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="438" y="318" font-size="130" font-weight="800" letter-spacing="1" fill="#F8FAFC">WMOOP</text>
    <text x="442" y="378" font-size="33" font-weight="600" letter-spacing="1.2" fill="#93C5FD">World Map Object-Oriented Programming</text>
    <text x="442" y="420" font-size="24" font-weight="500" fill="#94A3B8">Describe the world in OOP &#8212; one model, many languages.</text>
  </g>
</svg>
