<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="WMOOP mark (mono)">
  <title>WMOOP mark — single colour (uses currentColor)</title>
  <!-- Single-colour mark for favicons, stamps, embossing. Inherits text colour via currentColor. -->
  <g fill="none" stroke="currentColor" stroke-width="5">
    <circle cx="60" cy="60" r="44"/>
    <ellipse cx="60" cy="60" rx="17" ry="44" stroke-width="3.2"/>
    <ellipse cx="60" cy="60" rx="44" ry="17" stroke-width="3.2"/>
  </g>
  <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="18"/>
    <line x1="60" y1="60" x2="102" y2="60"/>
    <line x1="60" y1="60" x2="60" y2="102"/>
    <line x1="60" y1="60" x2="18" y2="60"/>
  </g>
  <path d="M74 60 L81 54 L88 60 L81 66 Z" fill="currentColor"/>
  <g fill="currentColor">
    <circle cx="60" cy="60" r="6.5"/>
    <circle cx="60" cy="18" r="5.5"/>
    <circle cx="60" cy="102" r="5.5"/>
    <circle cx="18" cy="60" r="5.5"/>
    <circle cx="102" cy="60" r="5.5"/>
  </g>
</svg>
