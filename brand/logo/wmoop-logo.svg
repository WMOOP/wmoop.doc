<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 120" role="img" aria-label="WMOOP">
  <title>WMOOP — World Map Object-Oriented Programming (auto light/dark)</title>
  <defs>
    <linearGradient id="wmGlobeA" x1="20" y1="18" x2="98" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .wm-word { fill: #0F172A; }
      .wm-tag  { fill: #475569; }
      .wm-node { fill: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        .wm-word { fill: #F8FAFC; }
        .wm-tag  { fill: #CBD5E1; }
        .wm-node { fill: #0F172A; }
      }
    </style>
  </defs>

  <g transform="translate(6,9) scale(0.85)">
    <g fill="none" stroke="url(#wmGlobeA)" stroke-width="4.5">
      <circle cx="60" cy="60" r="44"/>
      <ellipse cx="60" cy="60" rx="17" ry="44" stroke-width="3"/>
      <ellipse cx="60" cy="60" rx="44" ry="17" stroke-width="3"/>
    </g>
    <g stroke="#3B82F6" stroke-width="4" stroke-linecap="round">
      <line x1="60" y1="60" x2="60" y2="16"/>
      <line x1="60" y1="60" x2="104" y2="60"/>
      <line x1="60" y1="60" x2="60" y2="104"/>
      <line x1="60" y1="60" x2="16" y2="60"/>
    </g>
    <path d="M74 60 L81 55 L88 60 L81 65 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    <g stroke-width="3.5" stroke="#1D4ED8">
      <rect class="wm-node" x="53.5" y="53.5" width="13" height="13" rx="3.5"/>
      <rect class="wm-node" x="53.5" y="9.5"  width="13" height="13" rx="3.5"/>
      <rect class="wm-node" x="53.5" y="97.5" width="13" height="13" rx="3.5"/>
      <rect class="wm-node" x="9.5"  y="53.5" width="13" height="13" rx="3.5"/>
      <rect x="97.5" y="53.5" width="13" height="13" rx="3.5" fill="#FDE68A" stroke="#B45309"/>
    </g>
  </g>

  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text class="wm-word" x="122" y="62" font-size="50" font-weight="800" letter-spacing="0.5">WMOOP</text>
    <text class="wm-tag" x="124" y="90" font-size="12.5" font-weight="600" letter-spacing="1">World Map Object-Oriented Programming</text>
  </g>
</svg>
