id: conf.transport.vehicle.classification
category: behaviour
description: >-
  Each kind of vehicle refines its classification down the extends chain. Hand-written behaviour that
  the bindings keep in step (ADR 0002).
given:
  - construct:
      type: wmoop.transport/Moped
      with: { wheelCount: 2, engineDisplacement: { value: 49, unit: cm3 } }
      bind: moped
  - construct:
      type: wmoop.transport/Motorcycle
      with: { wheelCount: 2, engineDisplacement: { value: 600, unit: cm3 } }
      bind: bike
expect:
  - get: { subject: moped, property: classification }
    equals: moped
  - get: { subject: bike, property: classification }
    equals: motorcycle
