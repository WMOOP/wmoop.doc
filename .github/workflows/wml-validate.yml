name: WML validation

# Machine-checkable Definition of Done (Invariant 6): every change to the model, the
# schema or the conformance vectors must keep the WML grammar + semantic gates green, the
# XML projections in sync with the YAML source, and the vectors consistent with the model.

on:
  push:
    paths:
      - ".gitmodules"
      - "external/**"
      - "model/**"
      - "conformance/**"
      - "schema/**"
      - ".github/workflows/wml-validate.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "external/**"
      - "model/**"
      - "conformance/**"
      - "schema/**"
      - ".github/workflows/wml-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the grammar: external/wmoop.json
          fetch-depth: 0 # full history, for the pin check below

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r schema/requirements.txt

      - name: Self-test the validator (one failing fixture per rule)
        run: python schema/test_validate_wml.py

      - name: Validate WML grammar + semantics (+ XSD projections)
        run: python schema/validate_wml.py --strict

      - name: Check XML projections are up to date
        run: python schema/yaml_to_xml.py --check

      - name: Self-test the conformance checker (one failing case per rule)
        run: python schema/test_build_conformance.py

      - name: Check the conformance vectors against the model; suite.json is current
        run: python schema/build_conformance.py --check

      - name: The grammar pin is a commit on WMOOP/wmoop.json main
        run: |
          git -C external/wmoop.json fetch --quiet origin main
          if ! git -C external/wmoop.json merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::external/wmoop.json pins a commit that is not on wmoop.json main"
            exit 1
          fi

  # After a green main, ask every binding to regenerate: their regen.yml moves the pins and opens
  # a "chore(regen): ..." pull request when the model or grammar change alters anything they commit.
  notify-bindings:
    name: Ask the bindings to regenerate
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.WMOOP_BOT_APP_ID }}
          private-key: ${{ secrets.WMOOP_BOT_PRIVATE_KEY }}
          owner: WMOOP
          repositories: wmoop.net,wmoop.py
      - name: Send wmoop-upstream-updated to every binding
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for repo in wmoop.net wmoop.py; do
            gh api "repos/WMOOP/$repo/dispatches" -f event_type=wmoop-upstream-updated -f "client_payload[source]=$SOURCE" -f "client_payload[sha]=$SHA"
          done
