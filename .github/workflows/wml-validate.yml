name: WML validation

# Machine-checkable Definition of Done (Invariant 6): every change to the model or
# the schema must keep the WML grammar + semantic gates green, and the XML projections
# in sync with the YAML source.

on:
  push:
    paths:
      - "model/**"
      - "schema/**"
      - ".github/workflows/wml-validate.yml"
  pull_request:
    paths:
      - "model/**"
      - "schema/**"
      - ".github/workflows/wml-validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r schema/requirements.txt

      - name: Validate WML grammar + semantics (+ XSD projections)
        run: python schema/validate_wml.py --strict

      - name: Check XML projections are up to date
        run: python schema/yaml_to_xml.py --check
