# Source register for wmoop.religion (template: docs/domain-kit/SOURCES.template.yaml).
#
# Every `provenance` entry in model/religion/religion.wml.yaml cites one of these works.
# Tiers per ETHICS.md §2.2. A URL carries `retrieved` only where it was opened on that date.

sources:
