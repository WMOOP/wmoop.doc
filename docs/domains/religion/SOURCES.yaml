  - key: smart-1996
    tier: A
    kind: book
    citation: "Smart, N. (1996). Dimensions of the Sacred: An Anatomy of the World's Beliefs. Berkeley: University of California Press."
    isbn: "978-0-520-20777-6"
    licence: "n/a (cited, not reused)"
    used_for: "The seven dimensions behind the properties of ReligiousTradition; the working definition of a tradition."

  - key: masuzawa-2005
    tier: A
    kind: book
    citation: "Masuzawa, T. (2005). The Invention of World Religions, or, How European Universalism Was Preserved in the Language of Pluralism. Chicago: University of Chicago Press."
    isbn: "978-0-226-50988-4"
    licence: "n/a (cited, not reused)"
    used_for: "The critique of the world-religions paradigm; why ReligiousFamilies is common usage, not consensus."

  - key: harvey-2000
    tier: A
    kind: book
    citation: "Harvey, P. (2000). An Introduction to Buddhist Ethics: Foundations, Values and Issues. Cambridge: Cambridge University Press."
    isbn: "978-0-521-55394-0"
    licence: "n/a (cited, not reused)"
