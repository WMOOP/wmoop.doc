module:
  id: wmoop.philosophy
  version: 0.1.0
  title: Philosophy
  depends_on:
    - { module: wmoop.core, version: "^1.0.0" }   # L0 upper ontology (root)

# ===========================================================================
# PHILOSOPHY - the structures of philosophical thought, modelled honestly.
#
# This domain lets WMOOP model the ABSTRACTIONS with which humans abstract the
# world: concepts, propositions, arguments, positions, and the branches and
# categories under which thought is organised. Everything here is an L0
# category-C ABSTRACT ENTITY (outside space-time); none of it is an endurant or
# a perdurant.
#
# Four modelling decisions carry the domain:
#
#   * CONTESTED CLASSIFICATION IS KEPT HONEST. Philosophy's own taxonomies are
#     disputed. We do NOT force a single correct tree and we do NOT reach for
#     non-grammar keys to flag disputes. The contest is written into the
#     `definition`/`note` text instead: Aristotle's ten categories are modelled
#     as ONE named, sourced scheme (rivals exist, e.g. Kant's), and the
#     partition of philosophy into branches is recorded as a convention, not a
#     unique or empirical division of the field.
#   * ABSTRACT ENTITY is NOT `kind: abstract`. AristotelianCategory and Branch
#     are abstract ENTITIES, yet they are `kind: concrete` - exactly the
#     wmoop.education/CurriculumSubject and wmoop.core/QuantityKind pattern - so
#     that their members (the ten categories; the five branches) can be L2
#     reference individuals. An OO `kind: abstract` class cannot be instantiated;
#     a concept whose instances we enumerate must be concrete.
#   * NO CONTESTED CLAIM IS ASSERTED AS FACT. A Proposition is modelled as a
#     truth-bearer without asserting WHICH propositions are true; a
#     PhilosophicalPosition records the theses it affirms without endorsing them;
#     whether abstract objects exist at all is left open in the prose.
#   * An agentive facet such as "Philosopher" (one who does philosophy) would be
#     a ROLE on wmoop.nature/Person, never a subclass [S3] - and is deliberately
#     left to a later fragment, keeping this first module to abstract structures.
# ===========================================================================

datatypes:
  - id: wmoop.philosophy/SyllogisticFigure
    name: SyllogisticFigure
    base: integer
    definition: >
      The figure of a categorical syllogism (1-4): the schematic arrangement of
      the middle term across the two premises.
    constraints: { minimum: 1, maximum: 4 }
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I, chs. 4-6 (the first three figures)", kind: sourced,
          note: "Aristotle sets out three figures; the fourth is a later, post-Aristotelian addition, so the bound admits 1-4." }

enumerations:
  - id: wmoop.philosophy/CategoricalForm
    name: CategoricalForm
    definition: >
      The four standard forms of a categorical proposition, classified by
      quantity (universal/particular) and quality (affirmative/negative).
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I.1 (premises as universal/particular and affirmative/negative)", kind: sourced,
          note: "The A/E/I/O letter mnemonic is the later, medieval naming of these four forms." }
    values:
      - { id: UNIVERSAL_AFFIRMATIVE,  definition: "'All S are P' (traditionally labelled A)." }
      - { id: UNIVERSAL_NEGATIVE,     definition: "'No S are P' (traditionally labelled E)." }
      - { id: PARTICULAR_AFFIRMATIVE, definition: "'Some S are P' (traditionally labelled I)." }
      - { id: PARTICULAR_NEGATIVE,    definition: "'Some S are not P' (traditionally labelled O)." }

interfaces:
  - id: wmoop.philosophy/ITruthBearer
    name: ITruthBearer
    definition: >
      The contract of a truth-bearer: anything that can be true or false and so
      can stand as a premise or a conclusion. Classical bivalence is assumed
      here; non-classical logics that admit further or indeterminate values are a
      known and legitimate departure.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "A behaviour contract over the philosophical notion of a truth-bearer; no bivalence claim is asserted about the world." }
    operations:
      - { name: isTrue, returns: boolean }

concepts:
  # --- The raw material of thought -----------------------------------------
  - id: wmoop.philosophy/PhilosophicalConcept
    name: PhilosophicalConcept
    kind: abstract
    definition: >
      An abstract idea or universal that is an object of philosophical analysis
      (e.g. justice, causation, identity, being).
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An L0 category-C abstract entity and the root of the philosophy.concepts sub-domain, left as an extension point for specific concepts. WMOOP records such concepts' structure without asserting their metaphysical status; realism vs. nominalism about abstracta is itself contested." }

  - id: wmoop.philosophy/Proposition
    name: Proposition
    kind: abstract
    implements: [ wmoop.philosophy/ITruthBearer ]
    definition: >
      A truth-apt content that is either true or false and can be affirmed,
      denied, or offered as a premise or a conclusion.
    provenance:
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entry 'Propositions'", kind: sourced,
          note: "Modelled as the primary bearer of truth-value. Whether propositions exist as mind-independent abstracta is contested; WMOOP commits only to their structural role." }
    properties:
      - id: wmoop.philosophy/Proposition#content
        name: content
        type: string
        cardinality: "0..1"
        definition: >
          A representative natural-language statement of the proposition. The
          proposition itself is language-neutral; this string is only one
          expression of it.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.philosophy/CategoricalProposition
    name: CategoricalProposition
    kind: concrete
    extends: wmoop.philosophy/Proposition          # a categorical proposition IS a proposition (shallow is-a, depth 2)
    definition: >
      A proposition that affirms or denies a predicate of a subject in one of the
      four standard forms, as used in categorical syllogisms.
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I.1 (affirmation/denial; universal/particular)", kind: sourced }
    properties:
      - id: wmoop.philosophy/CategoricalProposition#form
        name: form
        type: wmoop.philosophy/CategoricalForm
        cardinality: "1"
        definition: Which of the four standard categorical forms the proposition has.
        provenance:
          - { source: "Aristotle, Prior Analytics", ref: "Book I.1", kind: sourced }

  # --- Arguments: a shallow, honest is-a tree ------------------------------
  - id: wmoop.philosophy/Argument
    name: Argument
    kind: abstract
    definition: >
      A structured set of propositions in which one or more premises are offered
      in support of a conclusion.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Structural characterisation (premises support a conclusion), neutral between deductive and inductive support." }
    properties:
      - id: wmoop.philosophy/Argument#premiseCount
        name: premiseCount
        type: integer
        cardinality: "1"
        constraints: { minimum: 1 }
        definition: >
          The number of premises the argument offers (the arity of its hasPremise
          relation), exposed as a constrainable scalar.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
    relations:
      - id: wmoop.philosophy/Argument#hasPremise
        name: hasPremise
        target: wmoop.philosophy/Proposition
        cardinality: "1..*"
        inverse: wmoop.philosophy/Proposition#premiseOf
        definition: A proposition offered in support of the conclusion.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.philosophy/Argument#hasConclusion
        name: hasConclusion
        target: wmoop.philosophy/Proposition
        cardinality: "1"
        inverse: wmoop.philosophy/Proposition#conclusionOf
        definition: The proposition the premises are offered to support.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
    invariants:
      - id: premise-count-positive
        expr: "self.premiseCount >= 1"
        message: "An argument must offer at least one premise."

  - id: wmoop.philosophy/DeductiveArgument
    name: DeductiveArgument
    kind: concrete
    extends: wmoop.philosophy/Argument             # depth 2
    definition: >
      An argument whose conclusion is claimed to follow of necessity from its
      premises, so that it is valid or invalid.
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I.1, 24b18-20 (definition of deduction, sullogismos)", kind: sourced }
    properties:
      - id: wmoop.philosophy/DeductiveArgument#valid
        name: valid
        type: boolean
        cardinality: "0..1"
        definition: >
          Whether the argument is formally valid - its conclusion follows of
          necessity from its premises. A property to be assessed per argument,
          not asserted here.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.philosophy/InductiveArgument
    name: InductiveArgument
    kind: concrete
    extends: wmoop.philosophy/Argument             # depth 2
    definition: >
      An argument whose premises are offered to make the conclusion probable
      rather than necessary, so that it is strong or weak rather than valid.
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book II.23 (epagoge, induction)", kind: sourced,
          note: "The modern deductive/inductive contrast turns on necessary vs. merely probable support." }
    properties:
      - id: wmoop.philosophy/InductiveArgument#strong
        name: strong
        type: boolean
        cardinality: "0..1"
        definition: >
          Whether the premises lend the conclusion strong, as opposed to weak,
          support. Inductive strength is a matter of degree; this records the
          coarse assessment.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.philosophy/Syllogism
    name: Syllogism
    kind: concrete
    extends: wmoop.philosophy/DeductiveArgument     # depth 3 (<= 6, OK)
    definition: >
      A categorical syllogism: a deductive argument with exactly two categorical
      premises and a categorical conclusion, linked through a shared middle term.
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I, chs. 1-7 (the categorical syllogism and its figures)", kind: sourced }
    property_overrides:
      - { property: wmoop.philosophy/Argument#premiseCount, constraints: { enum: [2] } }   # S2 - exactly two premises; narrows minimum-1, LSP-safe
    properties:
      - id: wmoop.philosophy/Syllogism#figure
        name: figure
        type: wmoop.philosophy/SyllogisticFigure
        cardinality: "0..1"
        definition: The figure (1-4) fixing the position of the middle term across the premises.
        provenance:
          - { source: "Aristotle, Prior Analytics", ref: "Book I, chs. 4-6", kind: sourced }

  # --- Positions ------------------------------------------------------------
  - id: wmoop.philosophy/PhilosophicalPosition
    name: PhilosophicalPosition
    kind: abstract
    definition: >
      A stance on a philosophical question, characterised by the propositions it
      affirms as true (for example a thesis such as realism or dualism).
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An extension point for specific positions. WMOOP records which theses a position affirms WITHOUT asserting that the position is correct." }
    relations:
      - id: wmoop.philosophy/PhilosophicalPosition#assertsThesis
        name: assertsThesis
        target: wmoop.philosophy/Proposition
        cardinality: "1..*"
        inverse: wmoop.philosophy/Proposition#assertedBy
        definition: A proposition the position holds to be true.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.philosophy/PhilosophicalPosition#addressesBranch
        name: addressesBranch
        target: wmoop.philosophy/Branch
        cardinality: "0..1"
        inverse: wmoop.philosophy/Branch#addressedBy
        definition: The branch of philosophy the position belongs to.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  # --- Organising schemes: abstract entities enumerated as L2 individuals ---
  - id: wmoop.philosophy/AristotelianCategory
    name: AristotelianCategory
    kind: concrete                                  # instantiable so the ten categories are L2 individuals
    definition: >
      One of the ten highest kinds (categories) under which, in Aristotle's
      scheme, anything that can be said of a subject falls.
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced,
          note: "Modelled as ONE named, sourced category scheme, NOT the unique partition of being; rival schemes exist (e.g. Kant's twelve categories). `kind: concrete` so the ten categories are L2 individuals - an abstract entity enumerated by its members, as wmoop.education/CurriculumSubject is." }
    properties:
      - id: wmoop.philosophy/AristotelianCategory#greekTerm
        name: greekTerm
        type: string
        cardinality: "0..1"
        definition: The transliterated Greek term Aristotle uses for the category.
        provenance:
          - { source: "Aristotle, Categories", ref: "ch. 4", kind: sourced }

  - id: wmoop.philosophy/Branch
    name: Branch
    kind: concrete                                  # instantiable so the branches are L2 individuals
    definition: >
      A major field of philosophical inquiry, distinguished by the kind of
      question it asks.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "The partition of philosophy into branches is a CONVENTION, not a unique or empirical division: logic is also claimed by mathematics, and ethics and aesthetics are sometimes grouped together as axiology. `kind: concrete` so the branches are L2 individuals." }
    properties:
      - id: wmoop.philosophy/Branch#centralQuestion
        name: centralQuestion
        type: string
        cardinality: "0..1"
        definition: A short statement of the central question the branch addresses.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

# ---------------------------------------------------------------------------
# L2 reference individuals.
#
# The ten Aristotelian categories (instances of AristotelianCategory) and the
# five classical branches (instances of Branch) - exactly as the eight planets
# will be L2 instances of a Planet concept. Each carries its own sourced
# definition.
# ---------------------------------------------------------------------------
individuals:
  # --- The ten categories (Aristotle, Categories, ch. 4, 1b25-2a4) ----------
  - id: wmoop.philosophy/Substance
    name: Substance
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "What a thing is - the category of independent beings (Aristotle's examples: man, horse)."
    values: { greekTerm: "ousia" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Quantity
    name: Quantity
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "How much or how many something is (Aristotle's examples: four-foot, five-foot)."
    values: { greekTerm: "poson" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Quality
    name: Quality
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "What sort of thing something is (Aristotle's examples: white, grammatical)."
    values: { greekTerm: "poion" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Relation
    name: Relation
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "How something stands to something else (Aristotle's examples: double, half, greater)."
    values: { greekTerm: "pros ti" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Place
    name: Place
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "Where something is (Aristotle's examples: in the Lyceum, in the market-place)."
    values: { greekTerm: "pou" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Time
    name: Time
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "When something is (Aristotle's examples: yesterday, last year). The category of 'when', distinct from the physical quantity of time."
    values: { greekTerm: "pote" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Position
    name: Position
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "The posture in which something is placed (Aristotle's examples: is lying, is sitting)."
    values: { greekTerm: "keisthai" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/State
    name: State
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "The condition of having something (Aristotle's examples: has shoes on, has armour on)."
    values: { greekTerm: "echein" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Action
    name: Action
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "The doing of something (Aristotle's examples: to cut, to burn)."
    values: { greekTerm: "poiein" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  - id: wmoop.philosophy/Affection
    name: Affection
    instance_of: wmoop.philosophy/AristotelianCategory
    definition: "The undergoing of something, being acted upon (Aristotle's examples: to be cut, to be burned)."
    values: { greekTerm: "paschein" }
    provenance:
      - { source: "Aristotle, Categories", ref: "ch. 4, 1b25-2a4", kind: sourced }

  # --- The five classical branches ------------------------------------------
  - id: wmoop.philosophy/Metaphysics
    name: Metaphysics
    instance_of: wmoop.philosophy/Branch
    definition: "The study of what there is and the fundamental nature of reality: being, objects, properties, causation, time and possibility."
    values: { centralQuestion: "What is there, and what is its fundamental nature?" }
    provenance:
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entry 'Metaphysics'", kind: sourced }

  - id: wmoop.philosophy/Epistemology
    name: Epistemology
    instance_of: wmoop.philosophy/Branch
    definition: "The study of knowledge: its nature, sources, limits and justification, and the difference between knowledge and mere belief."
    values: { centralQuestion: "What is knowledge, and what can we know?" }
    provenance:
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entry 'Epistemology'", kind: sourced }

  - id: wmoop.philosophy/Ethics
    name: Ethics
    instance_of: wmoop.philosophy/Branch
    definition: "The study of right action, the good, and how one ought to live."
    values: { centralQuestion: "What ought one to do, and what is a good life?" }
    provenance:
      - { source: "Aristotle, Nicomachean Ethics", ref: "Book I (the good and the end of action)", kind: sourced,
          note: "One foundational treatment; the Stanford Encyclopedia of Philosophy also covers normative, meta- and applied ethics." }

  - id: wmoop.philosophy/Logic
    name: Logic
    instance_of: wmoop.philosophy/Branch
    definition: "The study of valid inference and the forms of correct reasoning. Its status as a branch of philosophy, rather than of mathematics, is itself debated."
    values: { centralQuestion: "What distinguishes a valid inference from an invalid one?" }
    provenance:
      - { source: "Aristotle, Prior Analytics", ref: "Book I.1 (the deduction, sullogismos)", kind: sourced,
          note: "Aristotle's founding of formal logic; the field now extends far beyond the syllogistic." }

  - id: wmoop.philosophy/Aesthetics
    name: Aesthetics
    instance_of: wmoop.philosophy/Branch
    definition: "The study of beauty, taste and the nature and value of art and aesthetic experience."
    values: { centralQuestion: "What is beauty, and what is the nature of art?" }
    provenance:
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entry 'The Concept of the Aesthetic'", kind: sourced }
