module:
  id: wmoop.core
  version: 1.0.0
  title: Core
  # depends_on: []  — core is the root. It realises L0 and references nothing;
  # every other module depends on it (keeps the module graph acyclic, Invariant 5).

# ===========================================================================
# wmoop.core — the L0 KERNEL, realised as an L1 module.
#
# This module is the "grammar's runtime": the quantity/unit/dimension apparatus
# (meta-model §6.4) plus the identity and provenance kernel (§6.3). Every other
# module pins it as `^1.0.0` and references the types below — most visibly the
# QuantityKinds `wmoop.core/Speed`, `/Volume`, `/Area` used to type measured
# properties (with a `unit:`), e.g. transport/Vehicle#maxSpeed and
# architecture/Room#floorArea.
#
# How §6.4's apparatus maps onto the WML grammar (which has no first-class
# QuantityKind/Unit/Dimension node and no object-typed properties):
#
#   * QuantityKind and Unit are concrete CONCEPTS (L1 classes). The specific
#     kinds (Length, Mass, Speed, …) and units (m, kg, s, …) are INDIVIDUALS
#     (L2 reference instances) — exactly how QUDT models them, and exactly how
#     wmoop.education models CurriculumSubject + Mathematics/Biology/…
#   * The SI Dimension 7-vector (L,M,T,I,Θ,N,J) is seven flat integer properties
#     on QuantityKind (objects/arrays aren't expressible in WML).
#   * A Unit's `toCanonical { factor, offset }` is flattened to two decimal
#     properties; its owning kind and a kind's canonical unit are QName-valued
#     reference properties (an individual's only way to carry an outbound link).
#
# A property typed `wmoop.core/Speed` therefore reads "a magnitude of the Speed
# quantity-kind"; its `unit:` names the Unit it is expressed in. Dimensional
# checking (§6.4) resolves the unit's `quantityKind` back to this catalogue.
# ===========================================================================

datatypes:
  - id: wmoop.core/Wmid
    name: Wmid
    base: string
    definition: >
      The opaque, immutable machine identity of a node (the "ConceptId"): the
      literal prefix `wmid:` followed by a 26-character Crockford base32 ULID.
      It never changes, even across rename or re-translation; all machine
      references ultimately resolve through it. WML source currently addresses
      nodes by their QName `id`; the Wmid is the stable identity behind it.
    constraints:
      pattern: "^wmid:[0-9A-HJKMNP-TV-Z]{26}$"
    provenance:
      - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3, identity lifecycle)",
          kind: convention,
          note: "Adopts the ULID spec (Crockford base32, 26 chars, time-sortable) as the opaque id." }

  - id: wmoop.core/QName
    name: QName
    base: string
    definition: >
      A stable, human-readable qualified name addressing a WMOOP node:
      `<module>` (e.g. `wmoop.core`), `<module>/<TypeName>` (e.g.
      `wmoop.core/Speed`), or `<module>/<Type>#<member>`. Stable by policy
      (changed only via deprecation + alias). The meta-model also renders a
      human alias form `wm:{domain}:{LocalName}`.
    constraints:
      pattern: "^wmoop\\.[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)*(/[A-Z][A-Za-z0-9]*(#[a-z][A-Za-z0-9]*)?)?$"
    provenance:
      - { source: "WMOOP meta-model (docs/02-meta-model.md §6.2–6.3, naming conventions)",
          kind: convention }

  - id: wmoop.core/DimensionExponent
    name: DimensionExponent
    base: integer
    definition: >
      The integer exponent of one SI base dimension within a QuantityKind's
      dimension vector (e.g. −1 for Time in Speed = L·T⁻¹). Zero means the base
      dimension does not appear.
    provenance:
      - { source: "ISO 80000-1:2022 Quantities and units — Part 1: General",
          ref: "dimension of a quantity", kind: sourced }

enumerations:
  - id: wmoop.core/ProvenanceKind
    name: ProvenanceKind
    definition: >
      The closed set of ways a provenance record may be grounded. Mirrors the
      `kind` of a WML provenance entry (schema/wml.schema.json) so the kernel's
      Provenance type is self-describing.
    provenance:
      - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3, Provenance object)",
          kind: definitional,
          note: "Enumerates the schema's provenanceEntry.kind values." }
    values:
      - { id: sourced,      definition: "An empirical/factual claim backed by a resolvable external source (standard, paper, dataset)." }
      - { id: definitional, definition: "A modelling or definitional choice that follows by definition; no external empirical source is claimed." }
      - { id: convention,   definition: "A naming or structural convention adopted by WMOOP." }

concepts:
  # --- The provenance kernel: a reified provenance record --------------------
  - id: wmoop.core/Provenance
    name: Provenance
    kind: concrete
    definition: >
      A single provenance record attached to a node, property or fact: where the
      claim comes from and how it is grounded. Reifies the built-in WML
      `provenance:` object so the kernel defines the very type the meta-level uses
      (Invariant 4 — nothing is unsourced).
    provenance:
      - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3, Provenance object)",
          kind: definitional }
    properties:
      - id: wmoop.core/Provenance#source
        name: source
        type: string
        cardinality: "1"
        required: true
        definition: The citation, standard, dataset or statement of origin for the claim.
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3)", kind: definitional }
      - id: wmoop.core/Provenance#kind
        name: kind
        type: wmoop.core/ProvenanceKind
        cardinality: "1"
        required: true
        definition: How the claim is grounded (sourced / definitional / convention).
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3)", kind: definitional }
      - id: wmoop.core/Provenance#ref
        name: ref
        type: string
        cardinality: "0..1"
        definition: A locator within the source (clause, table, page, field).
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3)", kind: definitional }
      - id: wmoop.core/Provenance#url
        name: url
        type: string
        cardinality: "0..1"
        definition: A resolvable URL for the source, where one exists.
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3)", kind: definitional }
      - id: wmoop.core/Provenance#note
        name: note
        type: string
        cardinality: "0..1"
        definition: A short human note qualifying the claim (e.g. a scope narrowing).
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.3)", kind: definitional }

  # --- QuantityKind: a measurable quality + its SI dimension vector ----------
  - id: wmoop.core/QuantityKind
    name: QuantityKind
    kind: concrete                               # instantiable — the kinds below are its L2 individuals
    definition: >
      A kind of measurable quantity (Length, Mass, Speed, …) characterised by its
      SI Dimension: a 7-vector of integer exponents over the SI base dimensions
      (L, M, T, I, Θ, N, J) = (Length, Mass, Time, ElectricCurrent, Temperature,
      AmountOfSubstance, LuminousIntensity). A derived kind (Speed, Area, Volume)
      also records its dimension formula. A property measured in some kind is
      typed by that kind and carries a `unit:` (meta-model §6.4).
    provenance:
      - { source: "BIPM, The International System of Units (SI), 9th edition (2019)",
          ref: "base quantities and dimensions",
          url: "https://www.bipm.org/en/publications/si-brochure", kind: sourced }
      - { source: "ISO 80000-1:2022 Quantities and units — Part 1: General",
          ref: "quantity, dimension of a quantity", kind: sourced }
    properties:
      - id: wmoop.core/QuantityKind#dimL
        name: dimL
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension L (Length) in this kind's dimension vector.
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimM
        name: dimM
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension M (Mass).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimT
        name: dimT
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension T (Time).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimI
        name: dimI
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension I (ElectricCurrent).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimTheta
        name: dimTheta
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension Θ (ThermodynamicTemperature).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimN
        name: dimN
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension N (AmountOfSubstance).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#dimJ
        name: dimJ
        type: wmoop.core/DimensionExponent
        cardinality: "1"
        default: 0
        definition: Exponent of base dimension J (LuminousIntensity).
        provenance:
          - { source: "ISO 80000-1:2022", kind: sourced }
      - id: wmoop.core/QuantityKind#canonicalUnit
        name: canonicalUnit
        type: wmoop.core/QName
        cardinality: "1"
        required: true
        definition: QName of the canonical (SI) Unit this kind's magnitudes reduce to.
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.4)", kind: definitional }
      - id: wmoop.core/QuantityKind#derivation
        name: derivation
        type: string
        cardinality: "0..1"
        definition: >
          For a derived kind, its dimension formula over base kinds
          (e.g. Speed = Length · Time⁻¹). Absent for a base kind.
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.4, derived QuantityKind)",
              kind: definitional }

  # --- Unit: a unit of measure belonging to a QuantityKind ------------------
  - id: wmoop.core/Unit
    name: Unit
    kind: concrete                               # instantiable — the units below are its L2 individuals
    definition: >
      A unit of measurement belonging to exactly one QuantityKind, with a linear
      conversion to that kind's canonical (SI) unit: canonical = factor · value +
      offset (the offset supports scales such as °C ↔ K). Units are first-class
      (meta-model §6.4, R5): a measured property names its Unit in `unit:`.
    provenance:
      - { source: "ISO 80000-1:2022 Quantities and units — Part 1: General",
          ref: "unit, coherent SI unit", kind: sourced }
      - { source: "BIPM, The International System of Units (SI), 9th edition (2019)",
          url: "https://www.bipm.org/en/publications/si-brochure", kind: sourced }
    properties:
      - id: wmoop.core/Unit#symbol
        name: symbol
        type: string
        cardinality: "1"
        required: true
        definition: The unit's written symbol as used in `unit:` fields (e.g. `m/s`, `km/h`, `m2`, `cm3`, `degC`).
        provenance:
          - { source: "ISO 80000-1:2022", ref: "unit symbols", kind: sourced }
      - id: wmoop.core/Unit#quantityKind
        name: quantityKind
        type: wmoop.core/QName
        cardinality: "1"
        required: true
        definition: QName of the QuantityKind this unit measures.
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.4)", kind: definitional }
      - id: wmoop.core/Unit#factor
        name: factor
        type: decimal
        cardinality: "1"
        default: 1
        definition: Multiplicative factor converting a value in this unit to the kind's canonical unit (`toCanonical.factor`).
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.4, toCanonical)", kind: definitional }
      - id: wmoop.core/Unit#offset
        name: offset
        type: decimal
        cardinality: "1"
        default: 0
        definition: Additive offset applied after the factor when converting to the canonical unit (`toCanonical.offset`; e.g. 273.15 for °C → K).
        provenance:
          - { source: "WMOOP meta-model (docs/02-meta-model.md §6.4, toCanonical)", kind: definitional }

# ===========================================================================
# L2 reference individuals — the quantity-kind and unit catalogue.
# The QuantityKinds carry their SI Dimension 7-vector; the Units carry their
# toCanonical { factor, offset } and the kind they belong to.
# ===========================================================================
individuals:
  # --- QuantityKinds --------------------------------------------------------
  - id: wmoop.core/Count
    name: Count
    instance_of: wmoop.core/QuantityKind
    definition: A dimensionless cardinal count of discrete entities.
    values: {
      dimL: 0, dimM: 0, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/One" }
    provenance:
      - { source: "ISO 80000-1:2022", ref: "quantities of dimension one", kind: sourced }

  - id: wmoop.core/Length
    name: Length
    instance_of: wmoop.core/QuantityKind
    definition: Extent in one spatial dimension. SI base quantity L.
    values: {
      dimL: 1, dimM: 0, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/Metre" }
    provenance:
      - { source: "ISO 80000-3:2019 Quantities and units — Part 3: Space and time",
          ref: "length", kind: sourced }

  - id: wmoop.core/Mass
    name: Mass
    instance_of: wmoop.core/QuantityKind
    definition: The amount of matter in a body. SI base quantity M.
    values: {
      dimL: 0, dimM: 1, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/Kilogram" }
    provenance:
      - { source: "ISO 80000-4:2019 Quantities and units — Part 4: Mechanics",
          ref: "mass", kind: sourced }

  - id: wmoop.core/Time
    name: Time
    instance_of: wmoop.core/QuantityKind
    definition: Duration between events. SI base quantity T.
    values: {
      dimL: 0, dimM: 0, dimT: 1, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/Second" }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "time, duration", kind: sourced }

  - id: wmoop.core/Speed
    name: Speed
    instance_of: wmoop.core/QuantityKind
    definition: Rate of change of position; a derived kind, Length per Time.
    values: {
      dimL: 1, dimM: 0, dimT: -1, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/MetrePerSecond",
      derivation: "Length · Time⁻¹" }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "speed", kind: sourced }

  - id: wmoop.core/Area
    name: Area
    instance_of: wmoop.core/QuantityKind
    definition: Extent of a two-dimensional surface; a derived kind, Length squared.
    values: {
      dimL: 2, dimM: 0, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/SquareMetre",
      derivation: "Length²" }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "area", kind: sourced }

  - id: wmoop.core/Volume
    name: Volume
    instance_of: wmoop.core/QuantityKind
    definition: Extent of a three-dimensional region of space; a derived kind, Length cubed.
    values: {
      dimL: 3, dimM: 0, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/CubicMetre",
      derivation: "Length³" }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "volume", kind: sourced }

  - id: wmoop.core/Temperature
    name: Temperature
    instance_of: wmoop.core/QuantityKind
    definition: Thermodynamic temperature. SI base quantity Θ.
    values: {
      dimL: 0, dimM: 0, dimT: 0, dimI: 0, dimTheta: 1, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/Kelvin" }
    provenance:
      - { source: "ISO 80000-5:2019 Quantities and units — Part 5: Thermodynamics",
          ref: "thermodynamic temperature", kind: sourced }

  - id: wmoop.core/Angle
    name: Angle
    instance_of: wmoop.core/QuantityKind
    definition: Plane angle; a quantity of dimension one, distinct in kind from Count.
    values: {
      dimL: 0, dimM: 0, dimT: 0, dimI: 0, dimTheta: 0, dimN: 0, dimJ: 0,
      canonicalUnit: "wmoop.core/Radian" }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "plane angle", kind: sourced }

  # --- Units ----------------------------------------------------------------
  - id: wmoop.core/One
    name: one
    instance_of: wmoop.core/Unit
    definition: The unit one — the coherent unit of a quantity of dimension one (Count).
    values: { symbol: "one", quantityKind: "wmoop.core/Count", factor: 1, offset: 0 }
    provenance:
      - { source: "ISO 80000-1:2022", ref: "the unit one", kind: sourced }

  - id: wmoop.core/Metre
    name: m
    instance_of: wmoop.core/Unit
    definition: Metre — the SI base and canonical unit of Length.
    values: { symbol: "m", quantityKind: "wmoop.core/Length", factor: 1, offset: 0 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)", ref: "the metre", kind: sourced }

  - id: wmoop.core/Kilogram
    name: kg
    instance_of: wmoop.core/Unit
    definition: Kilogram — the SI base and canonical unit of Mass.
    values: { symbol: "kg", quantityKind: "wmoop.core/Mass", factor: 1, offset: 0 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)", ref: "the kilogram", kind: sourced }

  - id: wmoop.core/Second
    name: s
    instance_of: wmoop.core/Unit
    definition: Second — the SI base and canonical unit of Time.
    values: { symbol: "s", quantityKind: "wmoop.core/Time", factor: 1, offset: 0 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)", ref: "the second", kind: sourced }

  - id: wmoop.core/MetrePerSecond
    name: m_per_s
    instance_of: wmoop.core/Unit
    definition: Metre per second — the coherent SI (canonical) unit of Speed.
    values: { symbol: "m/s", quantityKind: "wmoop.core/Speed", factor: 1, offset: 0 }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "metre per second", kind: sourced }

  - id: wmoop.core/KilometrePerHour
    name: km_per_h
    instance_of: wmoop.core/Unit
    definition: Kilometre per hour — a non-coherent unit of Speed used on road vehicles.
    values: { symbol: "km/h", quantityKind: "wmoop.core/Speed", factor: 0.2777777777777778, offset: 0 }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "kilometre per hour", kind: sourced }
      - { source: "Exact conversion 1 km/h = 1000 m / 3600 s = 1/3.6 m/s", kind: definitional }

  - id: wmoop.core/SquareMetre
    name: m2
    instance_of: wmoop.core/Unit
    definition: Square metre — the coherent SI (canonical) unit of Area.
    values: { symbol: "m2", quantityKind: "wmoop.core/Area", factor: 1, offset: 0 }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "square metre", kind: sourced }

  - id: wmoop.core/CubicMetre
    name: m3
    instance_of: wmoop.core/Unit
    definition: Cubic metre — the coherent SI (canonical) unit of Volume.
    values: { symbol: "m3", quantityKind: "wmoop.core/Volume", factor: 1, offset: 0 }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "cubic metre", kind: sourced }

  - id: wmoop.core/CubicCentimetre
    name: cm3
    instance_of: wmoop.core/Unit
    definition: Cubic centimetre — a sub-multiple unit of Volume used for engine displacement.
    values: { symbol: "cm3", quantityKind: "wmoop.core/Volume", factor: 0.000001, offset: 0 }
    provenance:
      - { source: "ISO 80000-3:2019", ref: "cubic centimetre", kind: sourced }
      - { source: "Exact conversion 1 cm³ = 1e-6 m³", kind: definitional }

  - id: wmoop.core/Kelvin
    name: K
    instance_of: wmoop.core/Unit
    definition: Kelvin — the SI base and canonical unit of thermodynamic Temperature.
    values: { symbol: "K", quantityKind: "wmoop.core/Temperature", factor: 1, offset: 0 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)", ref: "the kelvin", kind: sourced }

  - id: wmoop.core/DegreeCelsius
    name: degC
    instance_of: wmoop.core/Unit
    definition: Degree Celsius — a unit of Temperature offset from Kelvin by 273.15.
    values: { symbol: "degC", quantityKind: "wmoop.core/Temperature", factor: 1, offset: 273.15 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)",
          ref: "the degree Celsius; t/°C = T/K − 273.15", kind: sourced }

  - id: wmoop.core/Radian
    name: rad
    instance_of: wmoop.core/Unit
    definition: Radian — the coherent SI (canonical) unit of plane Angle.
    values: { symbol: "rad", quantityKind: "wmoop.core/Angle", factor: 1, offset: 0 }
    provenance:
      - { source: "BIPM SI Brochure, 9th ed. (2019)", ref: "the radian", kind: sourced }
