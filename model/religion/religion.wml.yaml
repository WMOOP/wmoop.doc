  # ===== Teachings: doctrines, values, precepts ==============================
  - id: wmoop.religion/TrinityDoctrine
    name: Doctrine of the Trinity
    instance_of: wmoop.religion/Doctrine
    definition: The Christian teaching that God is one being in three persons, the Father, the Son and the Holy Spirit.
    labels:
      pref: [ { lang: ro, value: "Dogma Sfintei Treimi" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Trinity'", kind: sourced }
    values:
      originalTerm: "Trinitas"

  - id: wmoop.religion/Tawhid
    name: Tawhid
    instance_of: wmoop.religion/Doctrine
    definition: The Islamic teaching of the absolute oneness and uniqueness of God.
    labels:
      pref: [ { lang: ar, value: "توحيد" }, { lang: ro, value: "Unicitatea lui Dumnezeu (tawhid)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'tawḥīd'", kind: sourced }
    values:
      originalTerm: "tawḥīd"

  - id: wmoop.religion/Karma
    name: Karma
    instance_of: wmoop.religion/Doctrine
    definition: The teaching that intentional actions have consequences that shape a being's future lives or states.
    labels:
      pref: [ { lang: sa, value: "कर्म" }, { lang: ro, value: "Karma" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'karma'", kind: sourced,
          note: "Shared by Hinduism, Buddhism, Jainism and Sikhism, which interpret it differently; one individual stands for the shared teaching and each tradition's reading belongs in its own notes." }
    values:
      originalTerm: "karman"

  - id: wmoop.religion/FourNobleTruths
    name: Four Noble Truths
    instance_of: wmoop.religion/Doctrine
    definition: The Buddhist teaching on suffering, its origin, its cessation and the path leading to its cessation.
    labels:
      pref: [ { lang: pi, value: "cattāri ariyasaccāni" }, { lang: ro, value: "Cele patru adevăruri nobile" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Four Noble Truths'", kind: sourced }
    values:
      originalTerm: "cattāri ariyasaccāni"

  - id: wmoop.religion/Anatta
    name: Anatta
    instance_of: wmoop.religion/Doctrine
    definition: The Buddhist teaching that there is no permanent, unchanging self in any being.
    labels:
      pref: [ { lang: ro, value: "Non-sinele (anatta)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'anatta'", kind: sourced }
    values:
      originalTerm: "anattā"

  - id: wmoop.religion/Agape
    name: Agape
    instance_of: wmoop.religion/EthicalValue
    definition: Self-giving love for God and neighbour, which Christianity teaches as the greatest of the virtues.
    labels:
      pref: [ { lang: grc, value: "ἀγάπη" }, { lang: ro, value: "Iubirea (agape)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'agape'", kind: sourced,
          note: "With faith and hope one of the three theological virtues (1 Corinthians 13:13)." }
    values:
      originalTerm: "agapē"

  - id: wmoop.religion/Metta
    name: Metta
    instance_of: wmoop.religion/EthicalValue
    definition: Loving-kindness towards all beings, the first of the four sublime attitudes of Buddhist teaching.
    labels:
      pref: [ { lang: ro, value: "Bunătatea iubitoare (metta)" } ]
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", kind: sourced }
    values:
      originalTerm: "mettā"

  - id: wmoop.religion/Karuna
    name: Karuna
    instance_of: wmoop.religion/EthicalValue
    definition: Compassion, the wish that beings be free of suffering, one of the four sublime attitudes of Buddhist teaching.
    labels:
      pref: [ { lang: ro, value: "Compasiunea (karuna)" } ]
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", kind: sourced }
    values:
      originalTerm: "karuṇā"

  - id: wmoop.religion/Ahimsa
    name: Ahimsa
    instance_of: wmoop.religion/EthicalValue
    definition: Non-violence towards all living beings, central in Jainism and taught also in Hinduism and Buddhism.
    labels:
      pref: [ { lang: sa, value: "अहिंसा" }, { lang: ro, value: "Non-violența (ahimsa)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'ahimsa'", kind: sourced }
    values:
      originalTerm: "ahiṃsā"

  - id: wmoop.religion/Seva
    name: Seva
    instance_of: wmoop.religion/EthicalValue
    definition: Selfless service to others, which Sikhism teaches as a central expression of devotion.
    labels:
      pref: [ { lang: pa, value: "ਸੇਵਾ" }, { lang: ro, value: "Slujirea dezinteresată (seva)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Sikhism'", kind: sourced }
    values:
      originalTerm: "sevā"

  # The Five Precepts of Buddhism: what lay followers undertake to abstain from.
  - id: wmoop.religion/PreceptAgainstKilling
    name: Abstaining from taking life
    instance_of: wmoop.religion/Precept
    definition: The first of the Five Precepts, the undertaking to abstain from killing living beings.
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", ref: "ch. 2, the five precepts", kind: sourced }
    values:
      originalTerm: "pāṇātipātā veramaṇī"
      polarity: PROHIBITION

  - id: wmoop.religion/PreceptAgainstStealing
    name: Abstaining from taking what is not given
    instance_of: wmoop.religion/Precept
    definition: The second of the Five Precepts, the undertaking to abstain from theft.
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", ref: "ch. 2, the five precepts", kind: sourced }
    values:
      originalTerm: "adinnādānā veramaṇī"
      polarity: PROHIBITION

  - id: wmoop.religion/PreceptAgainstSexualMisconduct
    name: Abstaining from sexual misconduct
    instance_of: wmoop.religion/Precept
    definition: The third of the Five Precepts, the undertaking to abstain from misconduct concerning sensual pleasures.
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", ref: "ch. 2, the five precepts", kind: sourced }
    values:
      originalTerm: "kāmesu micchācārā veramaṇī"
      polarity: PROHIBITION

  - id: wmoop.religion/PreceptAgainstFalseSpeech
    name: Abstaining from false speech
    instance_of: wmoop.religion/Precept
    definition: The fourth of the Five Precepts, the undertaking to abstain from lying.
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", ref: "ch. 2, the five precepts", kind: sourced }
    values:
      originalTerm: "musāvādā veramaṇī"
      polarity: PROHIBITION

  - id: wmoop.religion/PreceptAgainstIntoxicants
    name: Abstaining from intoxicants
    instance_of: wmoop.religion/Precept
    definition: The fifth of the Five Precepts, the undertaking to abstain from intoxicating drink and drugs that cloud the mind.
    provenance:
      - { source: "Harvey, P. (2000). An Introduction to Buddhist Ethics. Cambridge University Press.", ref: "ch. 2, the five precepts", kind: sourced }
    values:
      originalTerm: "surāmerayamajjapamādaṭṭhānā veramaṇī"
      polarity: PROHIBITION

  # The Five Pillars of Islam: the acts Islam holds obligatory.
  - id: wmoop.religion/Shahada
    name: Shahada
    instance_of: wmoop.religion/Precept
    definition: The first pillar of Islam, the profession that there is no god but God and that Muhammad is the messenger of God.
    labels:
      pref: [ { lang: ar, value: "الشهادة" }, { lang: ro, value: "Mărturisirea de credință (shahada)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Pillars of Islam'", kind: sourced }
    values:
      originalTerm: "shahādah"
      polarity: OBLIGATION

  - id: wmoop.religion/Salat
    name: Salat
    instance_of: wmoop.religion/Precept
    definition: The second pillar of Islam, the ritual prayer performed five times a day.
    labels:
      pref: [ { lang: ar, value: "الصلاة" }, { lang: ro, value: "Rugăciunea rituală (salat)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Pillars of Islam'", kind: sourced }
    values:
      originalTerm: "ṣalāh"
      polarity: OBLIGATION

  - id: wmoop.religion/Zakat
    name: Zakat
    instance_of: wmoop.religion/Precept
    definition: The third pillar of Islam, the obligatory giving of a share of one's wealth to those in need.
    labels:
      pref: [ { lang: ar, value: "الزكاة" }, { lang: ro, value: "Dania obligatorie (zakat)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Pillars of Islam'", kind: sourced }
    values:
      originalTerm: "zakāh"
      polarity: OBLIGATION

  - id: wmoop.religion/Sawm
    name: Sawm
    instance_of: wmoop.religion/Precept
    definition: The fourth pillar of Islam, fasting from dawn to sunset during the month of Ramadan.
    labels:
      pref: [ { lang: ar, value: "الصوم" }, { lang: ro, value: "Postul din Ramadan (sawm)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'Pillars of Islam'", kind: sourced }
    values:
      originalTerm: "ṣawm"
      polarity: OBLIGATION

  - id: wmoop.religion/Hajj
    name: Hajj
    instance_of: wmoop.religion/Precept
    definition: The fifth pillar of Islam, the pilgrimage to Mecca, due once in a lifetime from every Muslim who is able to make it.
    labels:
      pref: [ { lang: ar, value: "الحج" }, { lang: ro, value: "Pelerinajul la Mecca (hajj)" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'hajj'", kind: sourced }
    values:
      originalTerm: "ḥajj"
      polarity: OBLIGATION

