module:
  id: wmoop.religion
  version: 0.1.0
  title: Religion
  depends_on:
    - { module: wmoop.core,   version: "^1.0.0" }   # L0 upper ontology (root)
    - { module: wmoop.nature, version: "^0.7.0" }   # for Person, the player of the Cleric role [INV-5]
    - { module: wmoop.org,    version: "^0.1.0" }   # ReligiousOrganization IS-A Organization

# ===========================================================================
# RELIGION - religious traditions as belief systems, modelled as claims.
#
# The worked example of docs/08-contributing-a-domain.md; its design document is
# docs/domains/religion/WHITEPAPER.md. Five decisions carry the domain:
#
#   * TRADITIONS ARE INDIVIDUALS, NOT CLASSES. Christianity, Islam, Protestantism
#     and the Baptist tradition carry the same kinds of facts with different
#     values, so each is an L2 individual of ReligiousTradition (as Mars is an
#     individual of Planet). A class per tradition would be a subclass explosion
#     with no added structure.
#   * A BRANCH IS PART OF ITS PARENT, NOT A SUBTYPE. `parentTradition` is a
#     part-whole link between individuals (Baptists -> Protestantism ->
#     Christianity); `emergedFrom` is historical derivation without membership
#     (the Baha'i Faith emerged from Shia Islam but is not part of Islam).
#   * MONOTHEISM IS A CLASSIFICATION, NOT A PARENT CLASS. Theism type, family
#     (Abrahamic, Indian, ...) and regional groupings such as the Romanian
#     "neo-Protestant" are first-class SCHEMES (ADR 0001); each tradition carries
#     sourced `classified_as` claims, several where sources disagree.
#   * BELIEF IS MODELLED AS BELIEF (ETHICS.md §3.3). A Deity individual records a
#     tradition's conception of a divine being; a Teaching is what a tradition
#     teaches. Nothing here asserts that a deity exists or a doctrine is true.
#   * NO PERSON IS CLASSIFIED BY RELIGION (ETHICS.md §3.1, CONTRIBUTING.md §12).
#     There is no Person#religion and no Believer role. Serving as clergy is an
#     office, so Cleric is a role; founders and prophets are ReligiousFigures
#     whose historicity is stated, not assumed.
#
# Years are integers in ISO 8601 astronomical numbering (1 CE = 1, 1 BCE = 0,
# 2 BCE = -1), always paired with a human-readable period that keeps the
# uncertainty visible.
# ===========================================================================

datatypes:
  - id: wmoop.religion/HistoricalYear
    name: HistoricalYear
    base: integer
    definition: >
      A calendar year in astronomical numbering, in which 1 CE is 1, 1 BCE is 0
      and 2 BCE is -1, so that years before the common era are ordinary integers.
    provenance:
      - { source: "ISO 8601-2:2019, Date and time - Representations for information interchange - Part 2: Extensions", kind: sourced,
          note: "Year zero and negative (expanded) years, by agreement between the communicating parties. The proleptic Gregorian calendar is assumed; an approximate year carries its uncertainty in the paired human-readable period." }

  - id: wmoop.religion/UnicodeCodePoint
    name: UnicodeCodePoint
    base: string
    definition: A Unicode code point written in the standard U+ notation with four to six uppercase hexadecimal digits.
    constraints: { pattern: "^U\\+[0-9A-F]{4,6}$" }
    provenance:
      - { source: "The Unicode Standard", ref: "Appendix A, Notational Conventions (code points as U+ followed by 4-6 hex digits)", kind: sourced }

  - id: wmoop.religion/WikidataId
    name: WikidataId
    base: string
    definition: The identifier of a Wikidata item, the letter Q followed by a positive integer.
    constraints: { pattern: "^Q[1-9][0-9]*$" }
    provenance:
      - { source: "Wikidata", ref: "Help:Items (item identifiers)", url: "https://www.wikidata.org/wiki/Help:Items", kind: sourced,
          note: "A Tier C cross-reference for interoperability (ETHICS.md §2.2); it never supports a fact on its own." }

enumerations:
  - id: wmoop.religion/TraditionVitality
    name: TraditionVitality
    definition: Whether a tradition is practised today by a continuing community, is known only historically, or is a modern revival.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "A revival is recorded as its own tradition that emergedFrom the historical one; the historical tradition stays HISTORICAL." }
    values:
      - { id: LIVING,     definition: "Practised today by a community that continues it without a break." }
      - { id: HISTORICAL, definition: "No longer practised as a continuous tradition; known from historical and archaeological sources." }
      - { id: REVIVED,    definition: "A modern reconstruction or revival of a historical tradition." }

  - id: wmoop.religion/Historicity
    name: Historicity
    definition: What historical scholarship concludes about whether a figure presented by a tradition existed as a historical person.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "The scale records the state of scholarship, not the tradition's belief. Each figure's value is sourced on the individual." }
    values:
      - { id: HISTORICAL_CONSENSUS, definition: "Historians broadly agree that the person existed, whatever they conclude about the traditions told of them." }
      - { id: DEBATED,              definition: "Historians disagree whether, or in what form, the person existed." }
      - { id: TRADITION_ONLY,       definition: "Known only from the tradition's own texts; historical method cannot assess the figure's existence." }

  - id: wmoop.religion/PreceptPolarity
    name: PreceptPolarity
    definition: Whether a precept obliges, recommends, discourages or prohibits the action it concerns.
    provenance:
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entry 'Deontic Logic' (obligatory, permissible, forbidden)", kind: sourced,
          note: "A four-step scale between obligation and prohibition. Traditions have finer scales of their own, such as the five categories (al-ahkam al-khamsa) of Islamic jurisprudence; those belong to a later sub-domain." }
    values:
      - { id: OBLIGATION,     definition: "The tradition holds the action to be required." }
      - { id: RECOMMENDATION, definition: "The tradition holds the action to be commendable but not required." }
      - { id: DISCOURAGEMENT, definition: "The tradition holds the action to be blameworthy but not forbidden." }
      - { id: PROHIBITION,    definition: "The tradition holds the action to be forbidden." }

schemes:
  - id: wmoop.religion/TheismTypology
    name: TheismTypology
    definition: >
      Classifies a tradition by how it conceives the divine, with the values
      Monotheism, Polytheism, Henotheism, Monolatry, Monism, Dualism, Pantheism,
      Panentheism, Deism, Nontheism and Animism. A tradition may carry several
      claims, one per strand or per source; the typology is an analytic tool of
      religious studies, not a tradition's self-description.
    authority: "Comparative religion and philosophy of religion"
    consensus: scholarly-majority
    labels:
      pref: [ { lang: ro, value: "Tipologia teismului" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entries 'monotheism', 'polytheism', 'henotheism', 'monism', 'dualism', 'pantheism', 'deism', 'animism'", kind: sourced }
      - { source: "Stanford Encyclopedia of Philosophy", ref: "entries 'Pantheism' and 'Panentheism'", kind: sourced }

  - id: wmoop.religion/ReligiousFamilies
    name: ReligiousFamilies
    definition: >
      Groups traditions by historical lineage and shared heritage, with the
      values Abrahamic, Indian, Iranian, EastAsian, IndigenousAndEthnic and
      NewReligiousMovement. Reference works use the grouping widely, but the
      'world religions' framework behind it is a modern scholarly construction.
    authority: "Comparative religion reference works"
    consensus: common-usage
    labels:
      pref: [ { lang: ro, value: "Familii de religii" } ]
    provenance:
      - { source: "Encyclopaedia Britannica", ref: "entry 'classification of religions'", kind: sourced }
      - { source: "Masuzawa, T. (2005). The Invention of World Religions. University of Chicago Press.", kind: sourced,
          note: "The standard critique of the world-religions paradigm; the reason this grouping is common-usage, not scholarly consensus." }

  - id: wmoop.religion/RomanianLegalStatus
    name: RomanianLegalStatus
    definition: >
      Records the legal status a religious organization holds in Romania under
      Law no. 489/2006, with the values RecognisedDenomination (cult),
      ReligiousAssociation and ReligiousGroup. It classifies organizations, not
      traditions, and carries no judgement on doctrine.
    authority: "Romanian State: Law no. 489/2006 on religious freedom and the general regime of religious denominations"
    labels:
      pref: [ { lang: ro, value: "Statutul juridic al cultelor din România" } ]
    provenance:
      - { source: "Legea nr. 489/2006 privind libertatea religioasă și regimul general al cultelor", ref: "art. 49(1) and annex",
          url: "https://legislatie.just.ro/Public/DetaliiDocument/156588", kind: sourced,
          note: "Romanian 'cult' is the neutral legal term for a recognised religious denomination, unlike the pejorative English 'cult' (docs/08-contributing-a-domain.md §3.4). The annex lists the 18 denominations recognised when the law came into force." }
      - { source: "Secretariatul de Stat pentru Culte", ref: "list of recognised religious denominations", url: "https://culte.gov.ro/culte-religioase/", kind: sourced,
          note: "The current list: 19 denominations, after H.G. nr. 741/2024 recognised the Assemblies of God in Romania. Status claims are therefore dated." }

  - id: wmoop.religion/RomanianConfessionalGroups
    name: RomanianConfessionalGroups
    definition: >
      The grouping of Christian traditions common in Romanian scholarship and
      usage, with the values Orthodox, Catholic, Protestant and NeoProtestant;
      NeoProtestant gathers the Adventist, Baptist, Brethren (Christians
      according to the Gospel) and Pentecostal traditions.
    authority: "Romanian scholarly and common usage; not an official classification"
    consensus: common-usage
    labels:
      pref: [ { lang: ro, value: "Grupări confesionale (uz românesc)" } ]
    provenance:
      - { source: "Modoran, G. (2007). Confesiunile neoprotestante din România în perioada regimului comunist: 1945-1965. Studia Politica. Romanian Political Science Review 7(3), 655-673.",
          url: "https://www.ceeol.com/search/article-detail?id=144861", kind: sourced,
          note: "Uses the grouping for the Adventist, Baptist, Christians according to the Gospel and Pentecostal churches." }
      - { source: "Acta Marisiensis. Seria Historia 4(1) (2022), 27-43", title: "Modern Religious Movements on Romanian Territory: Can Evangelical Cults in Romania Historically be Seen as Neo-Protestant?",
          doi: "10.2478/amsh-2022-0019", kind: sourced,
          note: "The name is debated: 'evanghelic' (evangelical) is increasingly preferred, also by historians, while this article argues for keeping 'neoprotestant'." }
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Culturally relative (ETHICS.md §3.6) and unofficial: the State Secretariat for Religious Affairs and the 2021 census list each denomination on its own. English-language scholarship groups the same churches as Evangelical or Free Church Protestantism, so the grouping is a regional scheme, never a parent class." }

concepts:
  # --- The identity root and the tradition ----------------------------------
  - id: wmoop.religion/BeliefSystem
    name: BeliefSystem
    kind: abstract
    definition: >
      A coherent body of beliefs, values and practices about what is ultimately
      real, meaningful or valuable, shared by a community and passed on over time.
    labels:
      pref: [ { lang: ro, value: "Sistem de credințe" } ]
    provenance:
      - { source: "ETHICS.md §3.3 (belief systems as a first-class concept)", kind: definitional,
          note: "The identity root (L0 Kind) for religions here and, later, for philosophies and ideologies; a candidate to move to a shared module by issue, never unilaterally." }

  - id: wmoop.religion/ReligiousTradition
    name: ReligiousTradition
    kind: concrete
    extends: wmoop.religion/BeliefSystem          # a religious tradition IS a belief system (shallow is-a, depth 2)
    definition: >
      A belief system that a community passes on as a lineage of teachings,
      practices, narratives and institutions oriented to what it holds sacred
      or ultimate. A branch of a larger tradition is itself a tradition.
    labels:
      pref: [ { lang: ro, value: "Tradiție religioasă" } ]
      alt:  [ { lang: en, value: "Religion" }, { lang: ro, value: "Religie" } ]
    provenance:
      - { source: "Smart, N. (1996). Dimensions of the Sacred: An Anatomy of the World's Beliefs. University of California Press.", kind: sourced,
          note: "Smart's seven dimensions (doctrinal, narrative, ethical, ritual, experiential, social, material) are the checklist behind the properties below. Defining 'religion' is itself contested; this is a working definition, not a verdict." }
    properties:
      - id: wmoop.religion/ReligiousTradition#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same tradition.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#vitality
        name: vitality
        type: wmoop.religion/TraditionVitality
        cardinality: "1"
        definition: Whether the tradition is living, historical or revived.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#emergencePeriod
        name: emergencePeriod
        type: string
        cardinality: "0..1"
        definition: >
          When the tradition emerged as a distinct tradition, in words that keep
          the uncertainty, for example 'c. 6th-5th century BCE'.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "'Emergence' rather than 'founding': most traditions took shape over a period, and several deny having a beginning in time." }
      - id: wmoop.religion/ReligiousTradition#emergenceStartYear
        name: emergenceStartYear
        type: wmoop.religion/HistoricalYear
        cardinality: "0..1"
        definition: The earliest year of the emergence period, for sorting and querying.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#emergenceEndYear
        name: emergenceEndYear
        type: wmoop.religion/HistoricalYear
        cardinality: "0..1"
        definition: The latest year of the emergence period, for sorting and querying.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#originRegion
        name: originRegion
        type: string
        cardinality: "0..1"
        definition: The region where the tradition emerged, named as it was at the time.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "A historical region name, not a modern state: mapping ancient regions to present-day states can take a side in a dispute (ETHICS.md §3.2)." }
      - id: wmoop.religion/ReligiousTradition#parentTradition
        name: parentTradition
        type: wmoop.religion/ReligiousTradition
        cardinality: "0..1"
        definition: >
          The larger tradition of which this tradition is a branch. A part-whole
          link between traditions, not inheritance between classes.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "A property, not a part_of relation, because L2 individuals carry property values only. Where a placement is contested the individual's notes say so, and rival groupings are scheme claims." }
      - id: wmoop.religion/ReligiousTradition#emergedFrom
        name: emergedFrom
        type: wmoop.religion/ReligiousTradition
        cardinality: "0..*"
        completeness: open
        definition: Traditions this tradition historically arose from, without being a branch of them.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#founders
        name: founders
        type: wmoop.religion/ReligiousFigure
        cardinality: "0..*"
        completeness: open
        definition: >
          The figures regarded as the tradition's founders, as attributed in the
          individual's provenance. Empty does not mean that the tradition has none.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Founding is an attribution: a tradition may see a figure as a restorer or a messenger rather than a founder, and historians may weigh the roles differently." }
      - id: wmoop.religion/ReligiousTradition#principalDeities
        name: principalDeities
        type: wmoop.religion/Deity
        cardinality: "0..*"
        completeness: open
        definition: The divine beings at the centre of the tradition's worship, as the tradition conceives them.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousTradition#doctrines
        name: doctrines
        type: wmoop.religion/Doctrine
        cardinality: "0..*"
        completeness: open
        definition: Central doctrines the tradition teaches.
        provenance:
          - { source: "Smart (1996), doctrinal and philosophical dimension", kind: sourced }
      - id: wmoop.religion/ReligiousTradition#ethicalValues
        name: ethicalValues
        type: wmoop.religion/EthicalValue
        cardinality: "0..*"
        completeness: open
        definition: Central qualities of character the tradition teaches as good.
        provenance:
          - { source: "Smart (1996), ethical and legal dimension", kind: sourced }
      - id: wmoop.religion/ReligiousTradition#preceptSets
        name: preceptSets
        type: wmoop.religion/PreceptSet
        cardinality: "0..*"
        completeness: open
        definition: Named sets of precepts (commandments, pillars, vows) the tradition transmits.
        provenance:
          - { source: "Smart (1996), ethical and legal dimension", kind: sourced }
      - id: wmoop.religion/ReligiousTradition#sacredTexts
        name: sacredTexts
        type: wmoop.religion/SacredText
        cardinality: "0..*"
        completeness: open
        definition: Texts the tradition holds as scripture or as authoritative.
        provenance:
          - { source: "Smart (1996), narrative and doctrinal dimensions", kind: sourced }
      - id: wmoop.religion/ReligiousTradition#symbols
        name: symbols
        type: wmoop.religion/ReligiousSymbol
        cardinality: "0..*"
        completeness: open
        definition: Visual signs widely used to represent the tradition.
        provenance:
          - { source: "Smart (1996), material dimension", kind: sourced }

  # --- What a tradition holds: deities, figures, teachings -----------------
  - id: wmoop.religion/Deity
    name: Deity
    kind: concrete
    definition: >
      A god, goddess or other divine being as conceived within one or more
      traditions. An individual records a conception; it asserts neither that
      the being exists nor that conceptions in different traditions coincide.
    labels:
      pref: [ { lang: ro, value: "Divinitate" } ]
    provenance:
      - { source: "ETHICS.md §3.3 (belief modelled as belief, with attribution)", kind: definitional,
          note: "An L0 Abstract: the conception. The names a tradition uses for the deity are its labels, in each language and script." }
    properties:
      - id: wmoop.religion/Deity#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same conception.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.religion/ReligiousFigure
    name: ReligiousFigure
    kind: concrete
    definition: >
      A person or figure who holds a significant place in a tradition's teaching
      or history, such as a founder, prophet, teacher or reformer, as the
      tradition presents them.
    labels:
      pref: [ { lang: ro, value: "Personalitate religioasă" } ]
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Not wmoop.nature/Person: a figure is described as a tradition presents them, and its historicity is stated rather than assumed. A future, sourced link may identify a figure with a historical Person." }
    properties:
      - id: wmoop.religion/ReligiousFigure#historicity
        name: historicity
        type: wmoop.religion/Historicity
        cardinality: "1"
        definition: What historical scholarship concludes about the figure's existence.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousFigure#lifetime
        name: lifetime
        type: string
        cardinality: "0..1"
        definition: The figure's lifetime in words that keep the uncertainty, for example 'c. 563-483 BCE (dates debated)'.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousFigure#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same figure.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.religion/Teaching
    name: Teaching
    kind: abstract
    definition: >
      A belief, value or rule that a tradition teaches, recorded as that
      tradition's teaching and not as a claim of WMOOP.
    labels:
      pref: [ { lang: ro, value: "Învățătură" } ]
    provenance:
      - { source: "ETHICS.md §3.3 (tenets attributed to the tradition)", kind: definitional }
    properties:
      - id: wmoop.religion/Teaching#originalTerm
        name: originalTerm
        type: string
        cardinality: "0..1"
        definition: The tradition's own term for the teaching, romanized, for example 'tawhid' or 'anatta'.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Romanization per the whitepaper (IAST for Sanskrit and Pali, ALA-LC for Arabic and Hebrew); native-script forms go in labels." }

  - id: wmoop.religion/Doctrine
    name: Doctrine
    kind: concrete
    extends: wmoop.religion/Teaching
    definition: >
      A teaching about what is real or true - the divine, the world, the human
      condition or its final goal - as a tradition holds it.
    labels:
      pref: [ { lang: ro, value: "Doctrină" } ]
      alt:  [ { lang: ro, value: "Dogmă" } ]
    provenance:
      - { source: "Smart (1996), doctrinal and philosophical dimension", kind: sourced }

  - id: wmoop.religion/EthicalValue
    name: EthicalValue
    kind: concrete
    extends: wmoop.religion/Teaching
    definition: A teaching that names a disposition or quality of character that a tradition holds to be good.
    labels:
      pref: [ { lang: ro, value: "Valoare morală" } ]
    provenance:
      - { source: "Smart (1996), ethical and legal dimension", kind: sourced }

  - id: wmoop.religion/Precept
    name: Precept
    kind: concrete
    extends: wmoop.religion/Teaching
    definition: A teaching that obliges, recommends, discourages or prohibits a kind of action.
    labels:
      pref: [ { lang: ro, value: "Poruncă" } ]
      alt:  [ { lang: ro, value: "Precept" } ]
    provenance:
      - { source: "Smart (1996), ethical and legal dimension", kind: sourced,
          note: "Described in the third person ('abstaining from taking life'), never as an imperative (docs/08-contributing-a-domain.md §3.1)." }
    properties:
      - id: wmoop.religion/Precept#polarity
        name: polarity
        type: wmoop.religion/PreceptPolarity
        cardinality: "1"
        definition: Whether the precept obliges, recommends, discourages or prohibits its action.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.religion/PreceptSet
    name: PreceptSet
    kind: concrete
    definition: >
      A named collection of precepts that a tradition passes on as a unit, such
      as a list of commandments, pillars or vows.
    labels:
      pref: [ { lang: ro, value: "Set de porunci" } ]
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An L0 Collection. The same set may be counted or divided differently by different branches, as the Ten Commandments are." }
    properties:
      - id: wmoop.religion/PreceptSet#traditionalCount
        name: traditionalCount
        type: integer
        cardinality: "0..1"
        constraints: { minimum: 1 }
        definition: How many items the tradition counts in the set.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/PreceptSet#precepts
        name: precepts
        type: wmoop.religion/Precept
        cardinality: "0..*"
        completeness: open
        definition: The precepts recorded so far as members of the set.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  # --- Material and historical expressions ---------------------------------
  - id: wmoop.religion/SacredText
    name: SacredText
    kind: concrete
    definition: A text or body of texts that a tradition holds as scripture or as authoritative.
    labels:
      pref: [ { lang: ro, value: "Text sacru" } ]
      alt:  [ { lang: ro, value: "Scriptură" } ]
    provenance:
      - { source: "Smart (1996), narrative and doctrinal dimensions", kind: sourced,
          note: "An L0 Abstract (the work), not a physical copy. Canons differ between branches; the individual's notes say so." }
    properties:
      - id: wmoop.religion/SacredText#originalLanguages
        name: originalLanguages
        type: string
        cardinality: "0..*"
        definition: The languages in which the text was composed, as BCP-47 language subtags.
        provenance:
          - { source: "IETF BCP 47, Tags for Identifying Languages", kind: sourced }
      - id: wmoop.religion/SacredText#compositionPeriod
        name: compositionPeriod
        type: string
        cardinality: "0..1"
        definition: When scholars date the composition or compilation of the text, in words that keep the uncertainty.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/SacredText#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same text.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.religion/ReligiousSymbol
    name: ReligiousSymbol
    kind: concrete
    definition: A visual sign that stands for a tradition, a teaching or a sacred reality for those who use it.
    labels:
      pref: [ { lang: ro, value: "Simbol religios" } ]
    provenance:
      - { source: "Smart (1996), material dimension", kind: sourced,
          note: "A tradition has symbols, not a logo; an organization's emblem may be a registered trademark. Unicode characters carry no image licence, so they are the default representation." }
    properties:
      - id: wmoop.religion/ReligiousSymbol#unicodeCodePoint
        name: unicodeCodePoint
        type: wmoop.religion/UnicodeCodePoint
        cardinality: "0..1"
        definition: The Unicode code point of the character that encodes the symbol, if one exists.
        provenance:
          - { source: "The Unicode Standard", kind: sourced }
      - id: wmoop.religion/ReligiousSymbol#unicodeName
        name: unicodeName
        type: string
        cardinality: "0..1"
        definition: The character's name in the Unicode Character Database.
        provenance:
          - { source: "Unicode Character Database, UnicodeData.txt", kind: sourced }
      - id: wmoop.religion/ReligiousSymbol#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same symbol.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.religion/ReligiousEvent
    name: ReligiousEvent
    kind: concrete
    definition: >
      A historical occurrence that sources treat as significant in the history
      of one or more traditions, such as a council, a schism or a revival.
    labels:
      pref: [ { lang: ro, value: "Eveniment religios" } ]
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An L0 Perdurant. The traditions involved are referenced; their own accounts of the event may differ and are noted on the individual." }
    properties:
      - id: wmoop.religion/ReligiousEvent#period
        name: period
        type: string
        cardinality: "0..1"
        definition: When the event happened, in words that keep any uncertainty.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousEvent#startYear
        name: startYear
        type: wmoop.religion/HistoricalYear
        cardinality: "0..1"
        definition: The year the event began.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousEvent#endYear
        name: endYear
        type: wmoop.religion/HistoricalYear
        cardinality: "0..1"
        definition: The year the event ended, when it lasted beyond one year.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousEvent#place
        name: place
        type: string
        cardinality: "0..1"
        definition: Where the event happened, named as at the time.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousEvent#traditions
        name: traditions
        type: wmoop.religion/ReligiousTradition
        cardinality: "0..*"
        completeness: open
        definition: The traditions whose history the event shaped.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.religion/ReligiousEvent#wikidataId
        name: wikidataId
        type: wmoop.religion/WikidataId
        cardinality: "0..1"
        definition: The Wikidata item that describes the same event.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  # --- The institution: a tradition is not an organization -----------------
  - id: wmoop.religion/ReligiousOrganization
    name: ReligiousOrganization
    kind: concrete
    extends: wmoop.org/Organization               # a church body IS an organization (cross-module is-a along depends_on)
    definition: >
      An organization through which a community of a religious tradition is
      governed, such as a church, a union of congregations or a federation of
      communities.
    labels:
      pref: [ { lang: ro, value: "Organizație religioasă" } ]
      alt:  [ { lang: ro, value: "Cult" }, { lang: en, value: "Religious denomination" } ]
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Eastern Orthodoxy is a tradition; the Romanian Orthodox Church is an organization of that tradition, with a legal name, a legal status and dates of its own." }
    properties:
      - id: wmoop.religion/ReligiousOrganization#tradition
        name: tradition
        type: wmoop.religion/ReligiousTradition
        cardinality: "1"
        definition: The tradition the organization belongs to.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

roles:
  - id: wmoop.religion/Cleric
    name: Cleric
    definition: >
      The role of a person ordained, appointed or recognised to lead worship,
      teach or administer rites for a religious organization, such as a priest,
      minister, imam or rabbi.
    labels:
      pref: [ { lang: ro, value: "Cleric" } ]
      alt:  [ { lang: ro, value: "Slujitor al cultului" } ]
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An office, so a role on Person by composition [S3]; it records a capacity, not a belief. There is deliberately no Believer or Adherent role: a person's religion is a protected attribute (ETHICS.md §3.1)." }
    played_by: wmoop.nature/Person
    context: wmoop.religion
    cardinality_per_player: "0..*"
    properties:
      - id: wmoop.religion/Cleric#title
        name: title
        type: string
        cardinality: "0..1"
        definition: The title of the office as the organization names it, for example 'preot', 'imam' or 'rabbi'.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
    relations:
      - id: wmoop.religion/Cleric#servesIn
        name: servesIn
        target: wmoop.religion/ReligiousOrganization
        cardinality: "0..*"
        inverse: wmoop.religion/ReligiousOrganization#clergy
        definition: The religious organizations in which the person holds the office.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

