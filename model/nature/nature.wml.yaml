module:
  id: wmoop.nature
  version: 0.6.0                              # 0.5.0 -> 0.6.0: added the anatomy file (Organ, OrganSystem, part_of Animal) — MINOR
  title: Nature
  depends_on:
    - { module: wmoop.core, version: "^1.0.0" }
  # This module spans several files: nature.wml.yaml (Animal -> Human -> Person)
  # and anatomy.wml.yaml (AnatomicalStructure -> Organ; OrganSystem; part_of Animal).

datatypes:
  - id: wmoop.nature/LegCount
    name: LegCount
    base: integer
    definition: A non-negative count of legs in an organism's typical adult body plan.
    constraints: { minimum: 0 }

concepts:
  - id: wmoop.nature/Animal
    name: Animal
    kind: abstract
    definition: A multicellular eukaryotic organism of the kingdom Animalia.
    provenance:
      - { source: "NCBI Taxonomy", ref: "taxid 33208 (Metazoa)", kind: sourced }
    properties:
      - id: wmoop.nature/Animal#legCount
        name: legCount
        type: wmoop.nature/LegCount
        cardinality: "0..1"
        definition: Number of legs in the organism's typical adult body plan.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Structural trait; per-taxon values are sourced at L2." }

  - id: wmoop.nature/Human
    name: Human
    kind: abstract
    extends: wmoop.nature/Animal
    definition: >
      A member of the species Homo sapiens. The intermediate biological ranks
      (Chordate, Mammal, Primate, …) are carried as `classified_as` facts rather than
      as inheritance levels, so the code hierarchy stays shallow [INV-3].
    provenance:
      - { source: "NCBI Taxonomy", ref: "taxid 9606 (Homo sapiens)", kind: sourced,
          note: "Also the authority for the classified_as taxonomic path below (ADR 0001: per-claim provenance on classified_as awaits the Scheme/claim schema enrichment)." }
    classified_as:
      - { scheme: wmoop.scheme/NcbiTaxonomy, value: "Chordata / Mammalia / Primates / Hominidae" }

  - id: wmoop.nature/Person
    name: Person
    kind: concrete
    extends: wmoop.nature/Human
    definition: An individual human being.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Legal/social person is a separate role, not biology." }
    properties:
      - id: wmoop.nature/Person#fullName
        name: fullName
        type: string
        cardinality: "1"
        definition: The person's full personal name as used for identification.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.nature/Person#dateOfBirth
        name: dateOfBirth
        type: date
        cardinality: "0..1"
        definition: The calendar date on which the person was born.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
