module:
  id: wmoop.nature
  version: 0.7.0                              # 0.6.0 -> 0.7.0: declared the NcbiTaxonomy scheme (ADR 0001) — MINOR
                                              # 0.5.0 -> 0.6.0: added the anatomy file (Organ, OrganSystem, part_of Animal) — MINOR
  title: Nature
  depends_on:
    - { module: wmoop.core, version: "^1.0.0" }
  # This module spans several files: nature.wml.yaml (Animal -> Human -> Person)
  # and anatomy.wml.yaml (AnatomicalStructure -> Organ; OrganSystem; part_of Animal).

datatypes:
  - id: wmoop.nature/LegCount
    name: LegCount
    base: integer
    definition: A non-negative count of legs in an organism's typical adult body plan.
    constraints: { minimum: 0 }

# Classification schemes the biology branch is classified under (ADR 0001): a concept's
# taxonomic ranks are scheme-qualified claims (`classified_as`), not inheritance levels.
schemes:
  - id: wmoop.nature/NcbiTaxonomy
    name: NcbiTaxonomy
    definition: >
      The NCBI Taxonomy: the curated classification and nomenclature of the organisms
      represented in the NCBI sequence databases, giving each taxon a ranked lineage.
    authority: NCBI (US National Center for Biotechnology Information)
    provenance:
      - { source: "Schoch, C. L. et al. (2020), NCBI Taxonomy: a comprehensive update on curation, resources and tools, Database 2020: baaa062",
          doi: "10.1093/database/baaa062", url: "https://www.ncbi.nlm.nih.gov/taxonomy", kind: sourced,
          note: "NCBI states the database is not an authoritative source for nomenclature or classification; it is one sourced scheme among rivals." }

concepts:
  - id: wmoop.nature/Animal
    name: Animal
    kind: abstract
    definition: A multicellular eukaryotic organism of the kingdom Animalia.
    provenance:
      - { source: "NCBI Taxonomy", ref: "taxid 33208 (Metazoa)", kind: sourced }
    properties:
      - id: wmoop.nature/Animal#legCount
        name: legCount
        type: wmoop.nature/LegCount
        cardinality: "0..1"
        definition: Number of legs in the organism's typical adult body plan.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Structural trait; per-taxon values are sourced at L2." }

  - id: wmoop.nature/Human
    name: Human
    kind: abstract
    extends: wmoop.nature/Animal
    definition: >
      A member of the species Homo sapiens. The intermediate biological ranks
      (Chordate, Mammal, Primate, …) are carried as `classified_as` facts rather than
      as inheritance levels, so the code hierarchy stays shallow [INV-3].
    provenance:
      - { source: "NCBI Taxonomy", ref: "taxid 9606 (Homo sapiens)", kind: sourced,
          note: "The classified_as taxonomic path below is a claim under the NcbiTaxonomy scheme and carries its own provenance (ADR 0001)." }
    classified_as:
      - { scheme: wmoop.nature/NcbiTaxonomy, value: "Chordata / Mammalia / Primates / Hominidae",
          provenance: [ { source: "NCBI Taxonomy", ref: "taxid 9606 (Homo sapiens), lineage", kind: sourced } ] }

  - id: wmoop.nature/Person
    name: Person
    kind: concrete
    extends: wmoop.nature/Human
    definition: An individual human being.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Legal/social person is a separate role, not biology." }
    properties:
      - id: wmoop.nature/Person#fullName
        name: fullName
        type: string
        cardinality: "1"
        definition: The person's full personal name as used for identification.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.nature/Person#dateOfBirth
        name: dateOfBirth
        type: date
        cardinality: "0..1"
        definition: The calendar date on which the person was born.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
