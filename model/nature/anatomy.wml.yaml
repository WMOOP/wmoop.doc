# module: wmoop.nature  (anatomy file of the Nature module; see nature.wml.yaml)
#
# "Animals (and therefore humans) have organs." This is modelled as MEREOLOGY
# (part_of), exactly like geography's Country/County/City containment — an Organ
# is PART OF an Animal, it is not a kind of Animal [INV-3]. Because Human is-a
# Animal (nature.wml.yaml), humans inherit the has-organ relation.
#
# Anatomy is a sensitive domain (human biology): every concept is sourced to an
# authoritative anatomy ontology (Uberon, FMA), structure only — no clinical or
# protected-attribute content (see AI_CONTRIBUTING.md §10).

concepts:
  - id: wmoop.nature/AnatomicalStructure
    name: AnatomicalStructure
    kind: abstract
    definition: >
      A connected biological structure with inherent 3-D shape, generated by the
      coordinated expression of an organism's own genome; a material part of a body.
    provenance:
      - { source: "Foundational Model of Anatomy (FMA), Rosse C & Mejino JLV, J Biomed Inform 36(6):478-500, 2003",
          ref: "FMA:67165 'Anatomical structure'", kind: sourced }
      - { source: "Uberon multi-species anatomy ontology (Mungall CJ et al., Genome Biology 2012;13:R5; PMID 22293552)",
          ref: "UBERON:0000061 'anatomical structure'", kind: sourced }

  - id: wmoop.nature/Organ
    name: Organ
    kind: concrete
    extends: wmoop.nature/AnatomicalStructure    # shallow is-a (depth 2)
    definition: >
      A self-contained anatomical structure, composed of several tissue types,
      that performs a specific function or set of functions in the body.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (Mungall CJ et al., Genome Biology 2012;13:R5; PMID 22293552)",
          ref: "UBERON:0000062 'organ'", kind: sourced }
    relations:
      - id: wmoop.nature/Organ#partOfOrganism
        name: partOfOrganism
        rel: part_of                             # mereology — NOT subclass_of
        target: wmoop.nature/Animal              # every organ is part of an animal (humans included)
        cardinality: "0..1"
        inverse: wmoop.nature/Animal#hasOrgan    # R6 [INV-5] — "an Animal HAS organs"
      - id: wmoop.nature/Organ#partOfSystem
        name: partOfSystem
        rel: part_of
        target: wmoop.nature/OrganSystem
        cardinality: "0..*"                       # an organ may serve more than one system
        inverse: wmoop.nature/OrganSystem#hasOrgan

  - id: wmoop.nature/OrganSystem
    name: OrganSystem
    kind: concrete
    definition: >
      A group of organs that work together to carry out one or more major body
      functions. An L0 Collection (a many-as-one) with its own identity.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (Mungall CJ et al., Genome Biology 2012;13:R5; PMID 22293552)",
          ref: "UBERON:0000467 'anatomical system'", kind: sourced }
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2 'Structural Organization of the Human Body'",
          kind: sourced, note: "The human body is commonly described as eleven organ systems." }

  # --- Specific organs: genuine shallow is-a of Organ (depth 3) ------------
  - id: wmoop.nature/Heart
    name: Heart
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      The muscular organ that pumps blood through the cardiovascular system; part
      of the cardiovascular system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0000948 'heart'", kind: sourced }

  - id: wmoop.nature/Brain
    name: Brain
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      The central organ of the nervous system, situated within the cranium in
      vertebrates; part of the nervous system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0000955 'brain'", kind: sourced }

  - id: wmoop.nature/Lung
    name: Lung
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      The respiration organ in which gas exchange between air and blood takes
      place; part of the respiratory system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0002048 'lung'", kind: sourced }

  - id: wmoop.nature/Liver
    name: Liver
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      The large exocrine gland that secretes bile and carries out metabolism,
      detoxification and storage functions; part of the digestive system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0002107 'liver'", kind: sourced }

  - id: wmoop.nature/Kidney
    name: Kidney
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      A paired organ of the urinary tract that produces urine and maintains
      fluid, electrolyte and acid-base homeostasis; part of the urinary system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0002113 'kidney'", kind: sourced }

  - id: wmoop.nature/Stomach
    name: Stomach
    kind: concrete
    extends: wmoop.nature/Organ
    definition: >
      An expanded region of the alimentary tract that stores and begins digesting
      food; part of the digestive system.
    provenance:
      - { source: "Uberon multi-species anatomy ontology (PMID 22293552)",
          ref: "UBERON:0000945 'stomach'", kind: sourced }

# ---------------------------------------------------------------------------
# L2 reference individuals — organ systems of the human body. (Exactly as the 8
# planets will be L2 individuals of space.solarsystem/Planet.) Five of the eleven
# are seeded here; the remaining six (integumentary, skeletal, muscular,
# endocrine, lymphatic/immune, reproductive) follow the same pattern.
# ---------------------------------------------------------------------------
individuals:
  - id: wmoop.nature/CardiovascularSystem
    name: CardiovascularSystem
    instance_of: wmoop.nature/OrganSystem
    definition: The system of heart and blood vessels that circulates blood around the body.
    provenance:
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2", kind: sourced }

  - id: wmoop.nature/NervousSystem
    name: NervousSystem
    instance_of: wmoop.nature/OrganSystem
    definition: The system of brain, spinal cord and nerves that detects stimuli and coordinates responses.
    provenance:
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2", kind: sourced }

  - id: wmoop.nature/RespiratorySystem
    name: RespiratorySystem
    instance_of: wmoop.nature/OrganSystem
    definition: The system of airways and lungs that takes in oxygen and expels carbon dioxide.
    provenance:
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2", kind: sourced }

  - id: wmoop.nature/DigestiveSystem
    name: DigestiveSystem
    instance_of: wmoop.nature/OrganSystem
    definition: The system that ingests, breaks down and absorbs food and eliminates waste.
    provenance:
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2", kind: sourced }

  - id: wmoop.nature/UrinarySystem
    name: UrinarySystem
    instance_of: wmoop.nature/OrganSystem
    definition: The system of kidneys and urinary tract that filters blood and excretes urine.
    provenance:
      - { source: "OpenStax, Anatomy and Physiology 2e, 2022, §1.2", kind: sourced }
