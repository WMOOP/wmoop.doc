module:
  id: wmoop.education
  version: 0.1.0
  title: Education
  depends_on:
    - { module: wmoop.core,         version: "^1.0.0" }   # L0 upper ontology
    - { module: wmoop.nature,       version: "^0.6.0" }   # for Person (role player) [INV-5]
    - { module: wmoop.org,          version: "^0.1.0" }   # for Organization (School is-a Organization)
    - { module: wmoop.architecture, version: "^0.1.0" }   # for Building / Room (physical plant)

# ===========================================================================
# EDUCATION — the "school" worked example, modelled honestly.
#
# The naive sketch is "School derives from Building; its rooms are classrooms".
# WMOOP rejects that the same way it rejects `Driver : Person` [INV-3]:
#
#   * A School IS NOT a kind of Building. The School is a social ORGANIZATION
#     (it is-a wmoop.org/Organization); the building is a physical endurant
#     (SchoolBuilding is-a wmoop.architecture/Building). The school is HOUSED IN
#     a building (a relation), it does not inherit from it.
#   * Classroom / Laboratory ARE kinds of Room (a genuine, shallow is-a), and a
#     Room is PART OF a Building (mereology, inherited from architecture).
#   * Student / Teacher / FormTutor (RO: "diriginte") are ROLES a Person plays,
#     attached by composition — never subclasses of Person. The same Person can
#     hold Teacher AND FormTutor at once (multi-role composition).
#   * A Subject (Mathematics, Biology, …) is an ABSTRACT body of knowledge
#     (CurriculumSubject); the specific subjects are L2 reference individuals.
#   * A Grade/Mark is a reified n-ary fact (value + scale + subject + date),
#     not a bare number hung off a Person.
# ===========================================================================

datatypes:
  - id: wmoop.education/SeatingCapacity
    name: SeatingCapacity
    base: integer
    definition: A non-negative count of student seats in a teaching space.
    constraints: { minimum: 0 }

  - id: wmoop.education/GradeValue
    name: GradeValue
    base: decimal
    definition: >
      A numeric grade value. The admissible range depends on the GradingScale it
      is recorded against (recorded per Mark), so no single bound is fixed here.
    constraints: { minimum: 0 }

enumerations:
  - id: wmoop.education/ISCEDLevel
    name: ISCEDLevel
    definition: Levels of education of the UNESCO International Standard Classification of Education (ISCED 2011).
    provenance:
      - { source: "UNESCO-UIS, International Standard Classification of Education (ISCED 2011), UIS/2012/INS/10 REV",
          ref: "Levels of education", kind: sourced }
    values:
      - { id: EARLY_CHILDHOOD,        definition: "ISCED 0 — early childhood education." }
      - { id: PRIMARY,                definition: "ISCED 1 — primary education." }
      - { id: LOWER_SECONDARY,        definition: "ISCED 2 — lower secondary education." }
      - { id: UPPER_SECONDARY,        definition: "ISCED 3 — upper secondary education." }
      - { id: POST_SECONDARY_NON_TERTIARY, definition: "ISCED 4 — post-secondary non-tertiary education." }
      - { id: SHORT_CYCLE_TERTIARY,   definition: "ISCED 5 — short-cycle tertiary education." }
      - { id: BACHELOR_OR_EQUIVALENT, definition: "ISCED 6 — bachelor's or equivalent level." }
      - { id: MASTER_OR_EQUIVALENT,   definition: "ISCED 7 — master's or equivalent level." }
      - { id: DOCTORAL_OR_EQUIVALENT, definition: "ISCED 8 — doctoral or equivalent level." }

  - id: wmoop.education/GradingScale
    name: GradingScale
    definition: Named grading scales against which a numeric Mark is interpreted. Scales are jurisdiction-specific.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "An open, extensible set; the enumerated members are common national scales, each sourced." }
    values:
      - { id: ROMANIAN_1_10,
          definition: "Romanian school scale, integers/decimals from 1 (lowest) to 10 (highest); pass >= 5." }
      - { id: PERCENTAGE_0_100,
          definition: "A percentage score from 0 to 100." }
      - { id: GPA_0_4,
          definition: "A grade-point average from 0.0 to 4.0." }

concepts:
  # --- The institution (a social Organization), NOT a building -------------
  - id: wmoop.education/EducationalInstitution
    name: EducationalInstitution
    kind: abstract
    extends: wmoop.org/Organization              # cross-domain is-a: an institution IS an organisation
    definition: >
      An organisation whose primary purpose is to provide education through one
      or more educational programmes.
    provenance:
      - { source: "UNESCO-UIS, International Standard Classification of Education (ISCED 2011), UIS/2012/INS/10 REV",
          ref: "'educational institution' / 'educational programme'", kind: sourced }
    properties:
      - id: wmoop.education/EducationalInstitution#iscedLevels
        name: iscedLevels
        type: wmoop.education/ISCEDLevel
        cardinality: "1..*"
        definition: The ISCED levels of education the institution provides.
        provenance:
          - { source: "UNESCO-UIS, International Standard Classification of Education (ISCED 2011), UIS/2012/INS/10 REV",
              kind: sourced }
    relations:
      - id: wmoop.education/EducationalInstitution#housedIn
        name: housedIn
        target: wmoop.education/SchoolBuilding
        cardinality: "0..*"                      # may occupy one or several buildings
        inverse: wmoop.education/SchoolBuilding#houses   # the School OCCUPIES the building; it is not a kind of it
        definition: The building(s) the institution occupies.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Deliberately a relation, not inheritance — the key modelling point of this domain." }

  - id: wmoop.education/School
    name: School
    kind: concrete
    extends: wmoop.education/EducationalInstitution
    definition: >
      An institution providing primary and/or secondary education (typically
      ISCED levels 1-3).
    provenance:
      - { source: "UNESCO-UIS, International Standard Classification of Education (ISCED 2011), UIS/2012/INS/10 REV",
          ref: "primary & secondary education (ISCED 1-3)", kind: sourced }
    property_overrides:
      - property: wmoop.education/EducationalInstitution#iscedLevels
        constraints: { enum: [PRIMARY, LOWER_SECONDARY, UPPER_SECONDARY] }   # S2 — narrows parent's range, LSP-safe

  # --- The physical plant (a Building), kept separate from the institution -
  - id: wmoop.education/SchoolBuilding
    name: SchoolBuilding
    kind: concrete
    extends: wmoop.architecture/Building         # cross-domain is-a: a school building IS a building
    definition: A building designed for or used by a school to deliver education.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "The physical counterpart of a School; a genuine is-a of Building (unlike School itself)." }

  - id: wmoop.education/Classroom
    name: Classroom
    kind: concrete
    extends: wmoop.architecture/Room             # a classroom IS a kind of room (shallow is-a)
    definition: A room in which a class of students is taught.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "A functional specialisation of Room; its containment in a building is the inherited part_of relation." }
    properties:
      - id: wmoop.education/Classroom#seatingCapacity
        name: seatingCapacity
        type: wmoop.education/SeatingCapacity
        cardinality: "0..1"
        definition: The number of students the classroom is furnished to seat.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  - id: wmoop.education/Laboratory
    name: Laboratory
    kind: concrete
    extends: wmoop.architecture/Room
    definition: A room equipped for practical scientific, technical or computing instruction.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional }
    properties:
      - id: wmoop.education/Laboratory#discipline
        name: discipline
        type: string
        cardinality: "0..1"
        definition: The discipline the laboratory is equipped for (e.g. chemistry, physics, informatics).
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  # --- A subject: an ABSTRACT body of knowledge (L0 category C) ------------
  - id: wmoop.education/CurriculumSubject
    name: CurriculumSubject
    kind: concrete                               # instantiable so specific subjects are L2 individuals
    definition: >
      A branch of knowledge studied and taught as part of a curriculum (e.g.
      Mathematics, Biology, Music). An abstract entity; the specific subjects are
      reference individuals at L2.
    provenance:
      - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)",
          ref: "broad/narrow fields", kind: sourced }
    properties:
      - id: wmoop.education/CurriculumSubject#iscedfField
        name: iscedfField
        type: string
        cardinality: "0..1"
        definition: The ISCED-F 2013 field of education and training this subject belongs to.
        provenance:
          - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)", kind: sourced }

  # --- A grade/mark: a reified assessment fact (n-ary relation) ------------
  - id: wmoop.education/Mark
    name: Mark
    kind: concrete
    definition: >
      A grade awarded to a student for a curriculum subject: a numeric value on a
      named grading scale, at a point in time. Reified so the (student, subject,
      value, date) fact is a first-class object [meta-model §10 Q5].
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "Reification of an n-ary assessment relation." }
    properties:
      - id: wmoop.education/Mark#value
        name: value
        type: wmoop.education/GradeValue
        cardinality: "1"
        definition: The numeric grade awarded.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.education/Mark#scale
        name: scale
        type: wmoop.education/GradingScale
        cardinality: "1"
        definition: The grading scale against which the value is interpreted.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.education/Mark#awardedOn
        name: awardedOn
        type: date
        cardinality: "0..1"
        definition: The date on which the mark was awarded.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
    relations:
      - id: wmoop.education/Mark#forSubject
        name: forSubject
        target: wmoop.education/CurriculumSubject
        cardinality: "1"
        inverse: wmoop.education/CurriculumSubject#assessedBy
        definition: The curriculum subject the mark assesses.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

  # --- A class/form: a Collection (L0 category H) -------------------------
  - id: wmoop.education/StudentClass
    name: StudentClass
    kind: concrete
    definition: >
      A cohort of students taught together as a unit (a "class" or "form"). A
      Collection: a many-as-one with its own identity, label and tutor.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "L0 Collection (category H)." }
    properties:
      - id: wmoop.education/StudentClass#label
        name: label
        type: string
        cardinality: "1"
        definition: The class's identifying label within its school (e.g. "9A").
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
      - id: wmoop.education/StudentClass#studyYear
        name: studyYear
        type: integer
        cardinality: "0..1"
        definition: The year/grade level of study the class is in.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }
    relations:
      - id: wmoop.education/StudentClass#atSchool
        name: atSchool
        target: wmoop.education/School
        cardinality: "0..1"
        inverse: wmoop.education/School#classes
        definition: The school the class belongs to.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional }

# ---------------------------------------------------------------------------
# L2 reference individuals — a few common curriculum subjects, sourced to the
# ISCED-F 2013 fields (exactly as the 8 planets will be L2 individuals of Planet).
# ---------------------------------------------------------------------------
individuals:
  - id: wmoop.education/Mathematics
    name: Mathematics
    instance_of: wmoop.education/CurriculumSubject
    definition: The study of quantity, structure, space and change.
    values:
      iscedfField: "054 Mathematics and statistics"
    provenance:
      - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)",
          ref: "field 054", kind: sourced }

  - id: wmoop.education/RomanianLanguage
    name: RomanianLanguage
    instance_of: wmoop.education/CurriculumSubject
    definition: The study of the Romanian language and its literature.
    values:
      iscedfField: "023 Languages"
    provenance:
      - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)",
          ref: "field 023", kind: sourced }

  - id: wmoop.education/Biology
    name: Biology
    instance_of: wmoop.education/CurriculumSubject
    definition: The study of living organisms and their vital processes.
    values:
      iscedfField: "051 Biological and related sciences"
    provenance:
      - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)",
          ref: "field 051", kind: sourced }

  - id: wmoop.education/Music
    name: Music
    instance_of: wmoop.education/CurriculumSubject
    definition: The study of organised sound, its theory, performance and history.
    values:
      iscedfField: "021 Arts"
    provenance:
      - { source: "UNESCO-UIS, ISCED Fields of Education and Training 2013 (ISCED-F 2013)",
          ref: "field 021", kind: sourced }
