module:
  id: wmoop.chemistry
  version: 0.1.0
  title: Chemistry
  depends_on:
    - { module: wmoop.core, version: "^1.0.0" }   # L0 kernel: QuantityKind/Unit (Temperature) [INV-5]

# ===========================================================================
# wmoop.chemistry — chemical substances (elements and compounds) and reactions.
#
# L0 stereotypes on show:
#   * ENDURANTS (persist through time, wholly present at each moment):
#       ChemicalSubstance (abstract) -> ChemicalElement, ChemicalCompound   (genuine is-a)
#       Atom, Molecule                                                      (particles)
#   * MEREOLOGY (part-whole as a RELATION, never inheritance):
#       Atom  part_of  Molecule
#   * PERDURANT (an occurrent/event that unfolds in time, not a persisting thing):
#       ChemicalReaction, tied to its substances by hasReactant / hasProduct
#   * ROLE (a contextual, anti-rigid facet held by COMPOSITION, never a subclass):
#       Catalyst, played_by ChemicalSubstance
# ===========================================================================

datatypes:
  - id: wmoop.chemistry/AtomicNumber
    name: AtomicNumber
    base: integer
    definition: >
      The proton number Z of a chemical element: a positive integer that uniquely
      identifies the element (1 for hydrogen, increasing by one across the periodic table).
    constraints: { minimum: 1 }

  - id: wmoop.chemistry/StandardAtomicWeight
    name: StandardAtomicWeight
    base: decimal
    definition: >
      The standard atomic weight (relative atomic mass) of an element: a dimensionless
      ratio conventionally expressed in unified atomic mass units (u, the dalton; 1 u =
      1/12 of the mass of a carbon-12 atom). Modelled as a local decimal rather than a
      wmoop.core Mass quantity because it is a relative, dimensionless mass, not an
      absolute one, so no SI dimension or unit from the core kernel applies.
    constraints: { minimum: 0 }

enumerations:
  - id: wmoop.chemistry/StateOfMatter
    name: StateOfMatter
    definition: The macroscopic physical state in which a substance presents under given conditions.
    provenance:
      - { source: "Original WMOOP definition", kind: definitional,
          note: "The three classical macroscopic states; plasma and further states are depth-on-demand." }
    values:
      - { id: SOLID,  definition: "Fixed shape and fixed volume; constituent particles held in a rigid arrangement." }
      - { id: LIQUID, definition: "Fixed volume but no fixed shape; particles mobile while remaining in contact." }
      - { id: GAS,    definition: "Neither fixed shape nor fixed volume; particles widely separated and free-moving." }

concepts:
  # --- Endurants: substances -------------------------------------------------
  - id: wmoop.chemistry/ChemicalSubstance
    name: ChemicalSubstance
    kind: abstract                               # R1 — cannot be instantiated directly
    definition: A form of matter with a definite chemical composition and characteristic properties.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "chemical substance", kind: sourced }
    properties:
      - id: wmoop.chemistry/ChemicalSubstance#standardState
        name: standardState
        type: wmoop.chemistry/StateOfMatter
        cardinality: "0..1"
        definition: The physical state of the pure substance at standard ambient temperature and pressure (298.15 K, 100 kPa).
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Per-substance values are sourced at L2." }
      - id: wmoop.chemistry/ChemicalSubstance#meltingPoint
        name: meltingPoint
        type: wmoop.core/Temperature            # a Quantity, dimension = temperature
        unit: K                                  # R5 — units are first-class [INV-4]
        cardinality: "0..1"
        definition: The temperature at which the pure substance passes from the solid to the liquid state at standard pressure.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Per-substance figures are sourced at L2." }

  - id: wmoop.chemistry/ChemicalElement
    name: ChemicalElement
    kind: concrete
    extends: wmoop.chemistry/ChemicalSubstance   # R2 — single, shallow is-a (depth 2); subkind only ADDS
    definition: A substance whose atoms all share the same number of protons and that cannot be broken down into simpler substances by chemical means.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "chemical element", kind: sourced }
    properties:
      - id: wmoop.chemistry/ChemicalElement#atomicNumber
        name: atomicNumber
        type: wmoop.chemistry/AtomicNumber
        cardinality: "1"
        definition: The number of protons in the nucleus of an atom of the element (its proton number, Z); the element's defining property.
        provenance:
          - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
              ref: "atomic number, Z", kind: sourced }
      - id: wmoop.chemistry/ChemicalElement#symbol
        name: symbol
        type: string
        cardinality: "1"
        definition: The one- or two-letter IUPAC-approved symbol identifying the element (e.g. H, Fe).
        provenance:
          - { source: "IUPAC. Nomenclature of Inorganic Chemistry (the 'Red Book', IUPAC Recommendations 2005)",
              ref: "IR-3 Elements", kind: sourced }
      - id: wmoop.chemistry/ChemicalElement#standardAtomicWeight
        name: standardAtomicWeight
        type: wmoop.chemistry/StandardAtomicWeight
        cardinality: "0..1"
        definition: The standard atomic weight of the element, averaged over the isotopic composition of normal terrestrial material.
        provenance:
          - { source: "IUPAC Commission on Isotopic Abundances and Atomic Weights (CIAAW), Standard Atomic Weights 2021",
              kind: sourced }

  - id: wmoop.chemistry/ChemicalCompound
    name: ChemicalCompound
    kind: concrete
    extends: wmoop.chemistry/ChemicalSubstance   # depth 2
    definition: A substance made of two or more different chemical elements chemically bonded in a fixed proportion.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "chemical compound", kind: sourced }
    properties:
      - id: wmoop.chemistry/ChemicalCompound#chemicalFormula
        name: chemicalFormula
        type: string
        cardinality: "0..1"
        definition: A formula expressing the compound's constituent elements and their proportions (e.g. H2O).
        provenance:
          - { source: "IUPAC. Nomenclature of Inorganic Chemistry (the 'Red Book', IUPAC Recommendations 2005)",
              ref: "IR-4 Formulae", kind: sourced }
    relations:
      - id: wmoop.chemistry/ChemicalCompound#hasConstituentElement
        name: hasConstituentElement
        rel: association                          # a plain association, not mereology
        target: wmoop.chemistry/ChemicalElement
        cardinality: "1..*"
        inverse: wmoop.chemistry/ChemicalElement#occursIn

  # --- Endurants: particles --------------------------------------------------
  - id: wmoop.chemistry/Atom
    name: Atom
    kind: concrete
    definition: The smallest particle of a chemical element that retains that element's chemical identity.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "atom", kind: sourced }
    relations:
      - id: wmoop.chemistry/Atom#element
        name: element
        rel: association                          # an atom IS-OF an element (classification), not a part of it
        target: wmoop.chemistry/ChemicalElement
        cardinality: "1"
        inverse: wmoop.chemistry/ChemicalElement#atoms
      - id: wmoop.chemistry/Atom#partOf
        name: partOf
        rel: part_of                              # mereology — an atom is a PART of a molecule, never a subclass
        target: wmoop.chemistry/Molecule
        cardinality: "0..1"
        inverse: wmoop.chemistry/Molecule#hasAtom

  - id: wmoop.chemistry/Molecule
    name: Molecule
    kind: concrete
    definition: An electrically neutral group of two or more atoms held together by chemical bonds, the smallest unit of a molecular substance.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "molecule", kind: sourced }

  # --- Perdurant: an event / occurrent ---------------------------------------
  - id: wmoop.chemistry/ChemicalReaction
    name: ChemicalReaction
    kind: concrete                               # a PERDURANT: an event unfolding in time, not an enduring thing
    definition: A process in which one or more chemical substances (reactants) are transformed into one or more different substances (products).
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "chemical reaction", kind: sourced }
    properties:
      - id: wmoop.chemistry/ChemicalReaction#isReversible
        name: isReversible
        type: boolean
        cardinality: "0..1"
        definition: Whether the reaction can proceed in both the forward and reverse directions under the same conditions.
        provenance:
          - { source: "Original WMOOP definition", kind: definitional,
              note: "Flags the Gold Book notion of a reversible reaction; per-reaction values are sourced at L2." }
    relations:
      - id: wmoop.chemistry/ChemicalReaction#hasReactant
        name: hasReactant
        rel: association
        target: wmoop.chemistry/ChemicalSubstance
        cardinality: "1..*"
        inverse: wmoop.chemistry/ChemicalSubstance#consumedIn
      - id: wmoop.chemistry/ChemicalReaction#hasProduct
        name: hasProduct
        rel: association
        target: wmoop.chemistry/ChemicalSubstance
        cardinality: "1..*"
        inverse: wmoop.chemistry/ChemicalSubstance#producedIn

# ===========================================================================
# Roles — contextual, anti-rigid facets held by COMPOSITION, never subclasses.
# "Catalyst" is something a substance ACTS AS in the context of a reaction; the
# same substance is not intrinsically a catalyst, so it is a role, not a kind,
# and never appears in any `extends` (S3).
# ===========================================================================
roles:
  - id: wmoop.chemistry/Catalyst
    name: Catalyst
    definition: The role of a substance that increases the rate of a chemical reaction without itself being consumed by it.
    provenance:
      - { source: "IUPAC. Compendium of Chemical Terminology (the 'Gold Book')",
          ref: "catalyst", kind: sourced }
    played_by: wmoop.chemistry/ChemicalSubstance   # the endurant that holds the role
    context:   wmoop.chemistry                      # the domain where the role is meaningful
    cardinality_per_player: "0..1"                  # a substance holds the Catalyst facet at most once
    relations:
      - id: wmoop.chemistry/Catalyst#catalyses
        name: catalyses
        rel: association
        target: wmoop.chemistry/ChemicalReaction
        cardinality: "1..*"
        inverse: wmoop.chemistry/ChemicalReaction#catalysedBy

# ===========================================================================
# L2 reference individuals — four elements. The full periodic table is
# depth-on-demand: these four are seeded; the remaining elements are added the
# same way, each sourced to the IUPAC Periodic Table (Z, symbol) and CIAAW
# (standard atomic weight).
# ===========================================================================
individuals:
  - id: wmoop.chemistry/Hydrogen
    name: Hydrogen
    instance_of: wmoop.chemistry/ChemicalElement
    definition: The chemical element with atomic number 1, the lightest element.
    values: { atomicNumber: 1, symbol: "H", standardAtomicWeight: 1.008 }
    provenance:
      - { source: "IUPAC Periodic Table of the Elements (2021)", ref: "Z = 1, symbol H", kind: sourced }
      - { source: "IUPAC CIAAW, Standard Atomic Weights 2021", ref: "hydrogen, abridged 1.008", kind: sourced }

  - id: wmoop.chemistry/Carbon
    name: Carbon
    instance_of: wmoop.chemistry/ChemicalElement
    definition: The chemical element with atomic number 6, the structural basis of organic chemistry.
    values: { atomicNumber: 6, symbol: "C", standardAtomicWeight: 12.011 }
    provenance:
      - { source: "IUPAC Periodic Table of the Elements (2021)", ref: "Z = 6, symbol C", kind: sourced }
      - { source: "IUPAC CIAAW, Standard Atomic Weights 2021", ref: "carbon, abridged 12.011", kind: sourced }

  - id: wmoop.chemistry/Oxygen
    name: Oxygen
    instance_of: wmoop.chemistry/ChemicalElement
    definition: The chemical element with atomic number 8.
    values: { atomicNumber: 8, symbol: "O", standardAtomicWeight: 15.999 }
    provenance:
      - { source: "IUPAC Periodic Table of the Elements (2021)", ref: "Z = 8, symbol O", kind: sourced }
      - { source: "IUPAC CIAAW, Standard Atomic Weights 2021", ref: "oxygen, abridged 15.999", kind: sourced }

  - id: wmoop.chemistry/Iron
    name: Iron
    instance_of: wmoop.chemistry/ChemicalElement
    definition: The chemical element with atomic number 26, a transition metal (Latin ferrum).
    values: { atomicNumber: 26, symbol: "Fe", standardAtomicWeight: 55.845 }
    provenance:
      - { source: "IUPAC Periodic Table of the Elements (2021)", ref: "Z = 26, symbol Fe", kind: sourced }
      - { source: "IUPAC CIAAW, Standard Atomic Weights 2021", ref: "iron, 55.845(2)", kind: sourced }
