module:
  id: wmoop.math
  version: 0.1.0
  title: Mathematics
  depends_on:
    - { module: wmoop.core, version: "^1.0.0" }   # L0 kernel (QuantityKind Count, Provenance)

# ===========================================================================
# wmoop.math — core mathematical OBJECTS as ABSTRACT entities (L0 category C):
# they exist outside space-time and have no causal powers. The module showcases
# three L0 distinctions:
#   * a rigid, SHALLOW is-a tower  (Number -> {ℕ, ℤ, ℚ, ℝ}; GeometricShape ->
#     Polygon -> {Triangle, Quadrilateral}) — kinds-of, never subset-as-subclass;
#   * a Set modelled as a kind of Collection (a "many-as-one");
#   * a Group as an AbstractType whose AXIOMS ARE INVARIANTS (closure,
#     associativity, identity, inverse) over its binary operation.
#
# There are deliberately NO roles here: a mathematical object has no causal
# powers, so it plays no agentive/contextual part — nothing in this domain is a
# "doer". (A Group is kind: concrete — it CAN be instantiated by a specific
# group such as (ℤ, +) — yet is still an L0-abstract entity.)
# ===========================================================================

datatypes:
  - id: wmoop.math/SideCount
    name: SideCount
    base: integer
    definition: The number of straight sides (edges) bounding a polygon; at least three.
    constraints: { minimum: 3 }
    provenance:
      - { source: "Euclid, Elements, Book I, Definition 19 (rectilinear figures)",
          ref: "trilateral, quadrilateral and multilateral figures distinguished by number of sides",
          kind: sourced }

interfaces:
  - id: wmoop.math/IComparable
    name: IComparable
    definition: >
      Contract for a totally ordered numeric value: any two values can be ranked.
      compareTo returns a negative integer, zero, or a positive integer according
      as self is less than, equal to, or greater than the other value.
    operations:
      - name: compareTo
        params: [ { name: other, type: wmoop.math/Number } ]
        returns: integer

concepts:
  # --- L0 category C: the abstract root of every mathematical object ----------
  - id: wmoop.math/MathematicalObject
    name: MathematicalObject
    kind: abstract                               # cannot be instantiated directly
    definition: >
      An abstract object of mathematics: an entity existing outside space-time and
      without causal powers, individuated purely by its defining properties.
    provenance:
      - { source: "WMOOP L0 stereotype — Abstract entity (category C): outside space-time, no causal powers.",
          kind: definitional }

  # --- A Set as a Collection (many-as-one) -----------------------------------
  - id: wmoop.math/Collection
    name: Collection
    kind: abstract
    extends: wmoop.math/MathematicalObject       # is-a (depth 2)
    definition: >
      A "many-as-one": a single abstract object that gathers zero or more member
      objects into a whole. The L0 Collection stereotype, realised here for the
      mathematical collections (whose members are themselves mathematical objects).
    provenance:
      - { source: "WMOOP L0 stereotype — Collection (a many-as-one grouping of members).",
          kind: definitional,
          note: "The many-as-one conception follows Cantor's notion of a set as a collection gathered into a whole." }
    properties:
      - id: wmoop.math/Collection#isEmpty
        name: isEmpty
        type: boolean
        cardinality: "1"
        definition: Whether the collection has no members.
        provenance:
          - { source: "WMOOP modelling choice — a membership predicate over the collection.",
              kind: definitional }
    relations:
      - id: wmoop.math/Collection#hasMember
        name: hasMember
        target: wmoop.math/MathematicalObject
        cardinality: "0..*"
        definition: >
          A member gathered by this collection — the set-membership relation (∈),
          which is NOT mereological parthood (an element is not a "part" of a set).

  - id: wmoop.math/Set
    name: Set
    kind: concrete                               # instantiable (a specific set is an instance)
    extends: wmoop.math/Collection               # is-a (depth 3): a Set is a kind of Collection
    definition: >
      A set: a collection of distinct members, unordered and without repetition,
      determined entirely by which objects are its members (extensionality).
    provenance:
      - { source: "Halmos, P. R., Naive Set Theory, Van Nostrand (1960)",
          ref: "the concept of a set; the axiom of extension",
          kind: sourced }
    properties:
      - id: wmoop.math/Set#isFinite
        name: isFinite
        type: boolean
        cardinality: "1"
        definition: Whether the set has finitely many members.
        provenance:
          - { source: "WMOOP modelling choice — the finite/infinite distinction as a Boolean facet.",
              kind: definitional,
              note: "Finiteness after Dedekind (a set is infinite iff it is equinumerous with a proper subset of itself); cf. Halmos, Naive Set Theory." }

  # --- The number tower: rigid, SHALLOW kinds of Number ----------------------
  #   Each is a KIND OF number (a sibling under Number), NOT a subclass of the
  #   next. The containments ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ are set INCLUSIONS between the number
  #   systems and are modelled in the definitions — they are deliberately NOT
  #   rendered as inheritance, which would conflate set-membership with
  #   classification (and would needlessly deepen the is-a chain).
  - id: wmoop.math/Number
    name: Number
    kind: abstract
    extends: wmoop.math/MathematicalObject
    implements: [ wmoop.math/IComparable ]
    definition: >
      A mathematical object expressing magnitude, count, or position on the real
      number line. In this module "Number" ranges over the real tower
      (ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ), which is totally ordered — hence IComparable.
    provenance:
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "standard number sets ℕ, ℤ, ℚ, ℝ",
          kind: sourced }

  - id: wmoop.math/NaturalNumber
    name: NaturalNumber
    kind: concrete
    extends: wmoop.math/Number                    # is-a (depth 3)
    definition: >
      A non-negative whole number 0, 1, 2, 3, … generated from zero by repeated
      succession (the counting numbers).
    provenance:
      - { source: "Peano, G. (1889), Arithmetices principia, nova methodo exposita",
          ref: "the Peano axioms for the natural numbers",
          kind: sourced }
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "the set of natural numbers ℕ",
          kind: sourced }

  - id: wmoop.math/Integer
    name: Integer
    kind: concrete
    extends: wmoop.math/Number
    definition: >
      A whole number — zero, a positive natural number, or its negative
      (…, −2, −1, 0, 1, 2, …). The naturals embed in the integers (ℕ ⊂ ℤ).
    provenance:
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "the set of integers ℤ",
          kind: sourced }

  - id: wmoop.math/RationalNumber
    name: RationalNumber
    kind: concrete
    extends: wmoop.math/Number
    definition: >
      A number expressible as a ratio p/q of two integers with q ≠ 0, identified
      up to equality of ratios. The integers embed in the rationals (ℤ ⊂ ℚ).
    provenance:
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "the set of rational numbers ℚ",
          kind: sourced }

  - id: wmoop.math/RealNumber
    name: RealNumber
    kind: concrete
    extends: wmoop.math/Number
    definition: >
      A number on the continuous number line: a member of the unique complete
      totally ordered field, containing the rationals and their limits (ℚ ⊂ ℝ).
    provenance:
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "the set of real numbers ℝ",
          kind: sourced }

  # --- Geometry: shapes as abstract figures (the Euclidean plane) -------------
  - id: wmoop.math/GeometricShape
    name: GeometricShape
    kind: abstract
    extends: wmoop.math/MathematicalObject
    definition: >
      An abstract geometric figure: that which is contained by one or more
      boundaries, studied up to its defining properties rather than any physical
      drawing of it.
    provenance:
      - { source: "Euclid, Elements, Book I, Definition 14",
          ref: "a figure is that which is contained by any boundary or boundaries",
          kind: sourced }

  - id: wmoop.math/Polygon
    name: Polygon
    kind: abstract
    extends: wmoop.math/GeometricShape            # is-a (depth 3)
    definition: >
      A plane figure bounded by a finite number of straight line segments (sides)
      joined end to end to form a single closed chain.
    provenance:
      - { source: "Euclid, Elements, Book I, Definition 19 (rectilinear figures)",
          ref: "figures contained by straight lines",
          kind: sourced }
    properties:
      - id: wmoop.math/Polygon#sideCount
        name: sideCount
        type: wmoop.math/SideCount
        cardinality: "1"
        definition: The number of straight sides bounding the polygon (equal to its number of vertices).
        provenance:
          - { source: "Euclid, Elements, Book I, Definition 19 (rectilinear figures)",
              ref: "trilateral, quadrilateral and multilateral figures distinguished by number of sides",
              kind: sourced }
      - id: wmoop.math/Polygon#isRegular
        name: isRegular
        type: boolean
        cardinality: "1"
        definition: Whether the polygon is both equilateral (all sides equal) and equiangular (all interior angles equal).
        provenance:
          - { source: "WMOOP modelling choice — regularity as a Boolean facet (equilateral and equiangular).",
              kind: definitional }
    invariants:
      - id: at-least-three-sides
        expr: "self.sideCount >= 3"
        message: "A polygon has at least three sides."

  - id: wmoop.math/Triangle
    name: Triangle
    kind: concrete
    extends: wmoop.math/Polygon                    # is-a (depth 4)
    definition: >
      A three-sided polygon (trilateral). Its three interior angles sum to two
      right angles (π rad).
    provenance:
      - { source: "Euclid, Elements, Book I, Definition 19 (trilateral figures)",
          kind: sourced,
          note: "The interior-angle sum of two right angles is Elements, Book I, Proposition 32." }
    property_overrides:
      - { property: wmoop.math/Polygon#sideCount, constraints: { enum: [3] } }   # S2 — narrows to exactly 3
    invariants:
      - id: three-sides
        expr: "self.sideCount == 3"
        message: "A triangle has exactly three sides."

  - id: wmoop.math/Quadrilateral
    name: Quadrilateral
    kind: concrete
    extends: wmoop.math/Polygon                    # is-a (depth 4)
    definition: >
      A four-sided polygon (quadrilateral). Its four interior angles sum to four
      right angles (2π rad).
    provenance:
      - { source: "Euclid, Elements, Book I, Definition 19 (quadrilateral figures)",
          kind: sourced,
          note: "Elements, Book I, Definition 22 names the square, oblong, rhombus and rhomboid quadrilaterals." }
    property_overrides:
      - { property: wmoop.math/Polygon#sideCount, constraints: { enum: [4] } }   # S2 — narrows to exactly 4
    invariants:
      - id: four-sides
        expr: "self.sideCount == 4"
        message: "A quadrilateral has exactly four sides."

  # --- Algebra: a Group as an AbstractType whose AXIOMS ARE INVARIANTS --------
  - id: wmoop.math/AlgebraicStructure
    name: AlgebraicStructure
    kind: abstract
    extends: wmoop.math/MathematicalObject
    definition: >
      A set (the carrier) together with one or more operations on it that satisfy
      a fixed list of axioms. Concrete structures (groups, rings, fields, …)
      differ by their operations and the axioms those operations obey.
    provenance:
      - { source: "Standard abstract algebra — an algebraic structure is a carrier set with operations satisfying stated axioms.",
          kind: definitional,
          note: "Umbrella modelling concept; cf. Dummit & Foote, Abstract Algebra, 3rd ed. (2004), Part I." }
    relations:
      - id: wmoop.math/AlgebraicStructure#underlyingSet
        name: underlyingSet
        target: wmoop.math/Set
        cardinality: "1"
        definition: The carrier set of elements on which the structure's operation(s) act.

  - id: wmoop.math/Group
    name: Group
    kind: concrete                                # instantiable, e.g. by (ℤ, +)
    extends: wmoop.math/AlgebraicStructure        # is-a (depth 3)
    definition: >
      An algebraic structure (G, ·): a set G with a single binary operation · that
      is closed, associative, has an identity element, and gives every element an
      inverse. Below, `·` denotes the group's binary operation and the four group
      axioms are stated as invariants (this is the "axioms are invariants" case).
    provenance:
      - { source: "Dummit, D. S. & Foote, R. M., Abstract Algebra, 3rd ed., John Wiley & Sons (2004)",
          ref: "§1.1, definition of a group",
          kind: sourced }
    properties:
      - id: wmoop.math/Group#order
        name: order
        type: wmoop.core/Count                    # a Quantity (dimension one)
        unit: "one"                               # R5 — a quantity-typed property carries a unit
        cardinality: "0..1"
        constraints: { minimum: 1 }
        definition: The order of the group — the number of elements in a finite group; omitted for an infinite group.
        provenance:
          - { source: "Dummit, D. S. & Foote, R. M., Abstract Algebra, 3rd ed. (2004)",
              ref: "§1.1, the order |G| of a group",
              kind: sourced }
      - id: wmoop.math/Group#isAbelian
        name: isAbelian
        type: boolean
        cardinality: "1"
        definition: Whether the group's binary operation is commutative (a · b = b · a for all a, b).
        provenance:
          - { source: "Dummit, D. S. & Foote, R. M., Abstract Algebra, 3rd ed. (2004)",
              ref: "§1.1, abelian (commutative) group — after N. H. Abel",
              kind: sourced }
    invariants:
      - id: closure
        expr: "forall a, b in self.underlyingSet: (a · b) in self.underlyingSet"
        message: "Closure: the group is closed under its binary operation."
      - id: associativity
        expr: "forall a, b, c in self.underlyingSet: (a · b) · c == a · (b · c)"
        message: "Associativity: the binary operation is associative."
      - id: identity
        expr: "exists e in self.underlyingSet: forall a in self.underlyingSet: (e · a == a) and (a · e == a)"
        message: "Identity: there is an identity element e with e · a = a · e = a."
      - id: inverse
        expr: "forall a in self.underlyingSet: exists b in self.underlyingSet: (a · b == e) and (b · a == e)"
        message: "Inverse: every element a has an inverse b with a · b = b · a = e."

# ===========================================================================
# L2 reference individuals — canonical mathematical objects.
# ===========================================================================
individuals:
  - id: wmoop.math/EmptySet
    name: EmptySet
    instance_of: wmoop.math/Set
    definition: The unique set with no members (∅); it is empty and finite.
    values: { isEmpty: true, isFinite: true }
    provenance:
      - { source: "ISO 80000-2:2019, Quantities and units — Part 2: Mathematics",
          ref: "the empty set, symbol ∅",
          kind: sourced }

  - id: wmoop.math/TrivialGroup
    name: TrivialGroup
    instance_of: wmoop.math/Group
    definition: >
      The trivial group ({e}, ·): the one-element group whose only element is the
      identity; it is abelian and has order 1.
    values: { order: 1, isAbelian: true }
    provenance:
      - { source: "Dummit, D. S. & Foote, R. M., Abstract Algebra, 3rd ed. (2004)",
          ref: "§1.1, the trivial group of order 1",
          kind: sourced }
